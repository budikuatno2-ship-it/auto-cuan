<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Masuk</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ac.css">
<script src="./motion.js" defer></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
.stage{position:relative;min-height:860px;background:#F6F7F5;overflow:hidden}
.ghost{position:absolute;inset:0;padding:120px 10%;color:#C9D1CD;font-weight:700;font-size:88px;line-height:.95;letter-spacing:-.045em;pointer-events:none;user-select:none}
.ov{position:absolute;inset:0;display:grid;place-items:center;padding:24px}
.dialog{width:100%;max-width:440px;background:var(--ac-surface);border:1px solid var(--ac-hair);border-radius:16px;box-shadow:var(--shadow2);padding:28px}
.pw{position:relative}
.pw button{position:absolute;right:4px;top:4px;width:34px;height:34px;border:0;background:transparent;border-radius:6px;cursor:pointer;color:var(--ac-2);display:grid;place-items:center}
.pw button:hover{background:var(--ac-hover)}
.or{display:flex;align-items:center;gap:12px;color:var(--ac-muted);font-size:12px;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--ac-hair)}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot 700ms linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.err{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--ac-neg-soft);color:var(--ac-neg);font-size:13px;margin-bottom:14px;animation:shake 360ms cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
</style>
</helmet>
<div class="stage">
  <div class="ghost" aria-hidden="true">Baca pasar.<br>Susun rencana.<br>Jaga konteks.</div>
  <div class="ov scrim">
    <div class="dialog dlg" role="dialog" aria-modal="true" aria-labelledby="ttl">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
        <div>
          <span style="width:30px;height:30px;border-radius:8px;background:var(--ac-inv);display:grid;place-items:center;margin-bottom:16px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-6 4 4 8-9"/></svg></span>
          <h1 id="ttl" style="margin:0;font-size:22px;letter-spacing:-.02em">Masuk ke Auto-Cuan</h1>
          <p class="mut" style="margin:4px 0 0">Akses meja kerja riset saham IDX.</p>
        </div>
        <a class="btn sm" href="Landing.dc.html" aria-label="Tutup" style="width:32px;padding:0">×</a>
      </div>
      <div style="height:22px"></div>
      <sc-if value="{{hasErr}}" hint-placeholder-val="{{false}}"><div class="err" role="alert"><b>!</b><span>{{errMsg}}</span></div></sc-if>
      <label class="flabel" for="u">Email atau username</label>
      <input id="u" class="inp" placeholder="nama@gmail.com" autocomplete="username" value="{{u}}" onInput="{{onU}}">
      <div class="help">Gunakan Gmail terdaftar. Username lama masih didukung.</div>
      <div style="height:16px"></div>
      <div style="display:flex;justify-content:space-between;align-items:baseline"><label class="flabel" for="p">Password</label><a class="lnk" href="AuthRecovery.dc.html" style="font-size:12px">Lupa password?</a></div>
      <div class="pw"><input id="p" class="inp" type="{{pwType}}" placeholder="Password Anda" autocomplete="current-password" value="{{p}}" onInput="{{onP}}" onKeyDown="{{onKey}}" style="padding-right:44px"><button onClick="{{togglePw}}" aria-label="{{pwLabel}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      <button class="btn p" onClick="{{submit}}" style="width:100%;height:44px;margin-top:22px;font-size:14px">
        <sc-if value="{{loading}}" hint-placeholder-val="{{false}}"><span class="spin" aria-hidden="true"></span></sc-if>{{btnText}}
      </button>
      <div class="or">atau</div>
      <a class="btn" href="AuthGmail.dc.html" style="width:100%;height:44px;font-size:14px"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.6 12.2c0-.8-.1-1.4-.2-2.1H12v4h6c-.3 1.4-1.1 2.6-2.3 3.4v2.8h3.7c2.1-2 3.2-4.9 3.2-8.1z"/><path fill="#34A853" d="M12 23c3.1 0 5.7-1 7.6-2.8l-3.7-2.8c-1 .7-2.3 1.1-3.9 1.1-3 0-5.5-2-6.4-4.7H1.8v2.9C3.7 20.5 7.6 23 12 23z"/><path fill="#FBBC05" d="M5.6 13.8c-.2-.7-.4-1.4-.4-2.2s.1-1.5.4-2.2V6.5H1.8C1 8 .6 9.7.6 11.6s.4 3.6 1.2 5.1l3.8-2.9z"/><path fill="#EA4335" d="M12 5.1c1.7 0 3.2.6 4.4 1.7l3.3-3.3C17.7 1.6 15.1.6 12 .6 7.6.6 3.7 3.1 1.8 6.5l3.8 2.9c.9-2.7 3.4-4.3 6.4-4.3z"/></svg>Masuk dengan Google</a>
      <p class="mut" style="text-align:center;margin:20px 0 0;font-size:13px">Belum punya akun? <a class="lnk" href="AuthRegister.dc.html">Daftar</a></p>
    </div>
  </div>
  <sc-if value="{{ok}}" hint-placeholder-val="{{false}}"><div style="position:absolute;left:50%;bottom:28px;transform:translateX(-50%)"><div class="toast"><svg class="ck" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>Berhasil masuk <a href="Main.dc.html" style="color:#6EE7B7;font-weight:600;text-decoration:none;margin-left:6px">Buka Dashboard →</a></div></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  constructor(props){ super(props); this.state = { show:false, loading:false, ok:false, err:'', u:'', p:'' }; }
  componentWillUnmount(){ clearTimeout(this.t); }
  renderVals() {
    const S = this.state;
    // prototipe: password di bawah 8 karakter disimulasikan sebagai kredensial salah
    const submit = () => {
      if (S.loading) return;
      if (!S.u.trim() || !S.p) return this.setState({err:'empty'});
      this.setState({loading:true, err:''});
      clearTimeout(this.t);
      this.t = setTimeout(() => { const fail = S.p.length < 8; this.setState({loading:false, err:fail?'bad':'', ok:!fail}); }, 1100);
    };
    return {
      pwType: S.show ? 'text' : 'password',
      pwLabel: S.show ? 'Sembunyikan password' : 'Tampilkan password',
      togglePw: () => this.setState({show:!S.show}),
      u: S.u, p: S.p, onU: (e) => this.setState({u:e.target.value, err:''}), onP: (e) => this.setState({p:e.target.value, err:''}),
      onKey: (e) => { if (e.key==='Enter') submit(); },
      loading: S.loading, ok: S.ok, hasErr: !!S.err,
      errMsg: S.err==='empty' ? 'Isi email atau username dan password dulu.' : 'Email/username atau password tidak cocok. Coba lagi atau pulihkan password.',
      btnText: S.loading ? 'Memeriksa…' : (S.ok ? 'Berhasil' : 'Masuk ke workspace'),
      submit
    };
  }
}
</script>
</body>
</html>
