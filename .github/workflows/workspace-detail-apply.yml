name: Apply reviewed workspace detail
on:
  push:
    branches: [fix/precision-workspace-finance]
    paths: [.github/workflows/workspace-detail-apply.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/precision-workspace-finance'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply exact visually verified mobile correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD^)" = 224327a689f5001b4bd846323ad670cfa934a942
          python <<'PY'
          import base64, hashlib, json, os, urllib.request, zlib
          from pathlib import Path
          url = 'https://api.github.com/repos/budikuatno2-ship-it/auto-cuan/git/blobs/76a50eee390f4619594c580efb91a934b72ba49e'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              data = base64.b64decode(json.load(response)['content'])
          assert hashlib.sha256(data).hexdigest() == '1f15723d77146084cbc20760fea7d0b41c631c918436ba598cfe098cfc39c405'
          items = json.loads(zlib.decompress(data))
          assert len(items) == 3
          assert {item['path'] for item in items} == {'public/ui-theme.css', 'tools/test-workspace-detail.py', 'public/index.html'}
          pending = {}
          for item in items:
              old = Path(item['path']).read_text()
              assert hashlib.sha256(old.encode()).hexdigest() == item['sha'], item['path']
              lines = old.splitlines(True)
              for start, end, text in reversed(item['edits']):
                  lines[start:end] = text.splitlines(True)
              content = ''.join(lines)
              assert hashlib.sha256(content.encode()).hexdigest() == item['after'], item['path']
              pending[item['path']] = content
          for name, content in pending.items():
              Path(name).write_text(content)
          Path('/tmp/mobile-correction-manifest.json').write_text(json.dumps({item['path']:item['after'] for item in items}))
          PY
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install -r tools/precision-test-requirements.txt
      - run: echo "CHROMIUM_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - run: node tools/validate-full-syntax.js && node tools/check-precision-inline.js && npm run build
      - run: PRECISION_TEST_OUTPUT=/tmp/precision-review python tools/test-workspace-detail.py
      - name: Commit only tested correction
        run: |
          python <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          files = json.loads(Path('/tmp/mobile-correction-manifest.json').read_text())
          for name, digest in files.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *files], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ui): keep mobile account and logout controls fully reachable'
          git push origin HEAD:refs/heads/fix/precision-workspace-finance
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: workspace-mobile-detail-validation
          path: /tmp/precision-review
          retention-days: 7
