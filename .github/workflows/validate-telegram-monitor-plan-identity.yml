name: Validate Telegram Monitor Plan Identity

on:
  push:
    branches:
      - fix/telegram-monitor-plan-identity
    paths:
      - '.github/workflows/validate-telegram-monitor-plan-identity.yml'
  pull_request:
    branches:
      - feat/daytrade-screener-v1
    types: [synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct-test-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: fix/telegram-monitor-plan-identity
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply idempotent timestamp correction and test
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          source_path = Path('api/sector-hot.js')
          source = source_path.read_text()
          old = """function isMonitorTimestampStale(value) {
            if (!value) return false;
            var text = String(value).trim();
            var parsed = /^d{4}-d{2}-d{2}$/.test(text) ? new Date(text + 'T23:59:59.999Z') : new Date(text);
            if (isNaN(parsed.getTime())) return true;
            var ageMs = Date.now() - parsed.getTime();
            if (ageMs < -15 * 60 * 1000) return true;
            return ageMs > 4 * 60 * 60 * 1000;
          }
          """
          new = """function isMonitorTimestampStale(value) {
            if (!value) return false;
            var text = String(value).trim();
            // Date-only observations are valid only for the current Jakarta trading date.
            // They do not pretend to provide intraday time precision.
            if (/^\\d{4}-\\d{2}-\\d{2}$/.test(text)) return text !== getJakartaDateString();
            var parsed = new Date(text);
            if (isNaN(parsed.getTime())) return true;
            var ageMs = Date.now() - parsed.getTime();
            if (ageMs < -15 * 60 * 1000) return true;
            return ageMs > 4 * 60 * 60 * 1000;
          }
          """
          if new not in source:
              if old not in source:
                  raise SystemExit('EXPECTED_TIMESTAMP_BLOCK_NOT_FOUND')
              source = source.replace(old, new, 1)

          export_anchor = "  resolveMonitorSetupOrigin: resolveMonitorSetupOrigin,\n"
          export_line = "  isMonitorTimestampStale: isMonitorTimestampStale,\n"
          if export_line not in source:
              if export_anchor not in source:
                  raise SystemExit('EXPECTED_EXPORT_ANCHOR_NOT_FOUND')
              source = source.replace(export_anchor, export_anchor + export_line, 1)
          source_path.write_text(source)

          test_path = Path('test/telegram-monitor-plan-identity.test.js')
          tests = test_path.read_text()
          destructure_old = "  evaluateMonitorStatus\n} = sectorHot.__test;"
          destructure_new = "  evaluateMonitorStatus,\n  isMonitorTimestampStale\n} = sectorHot.__test;"
          if destructure_new not in tests:
              if destructure_old not in tests:
                  raise SystemExit('EXPECTED_TEST_DESTRUCTURE_NOT_FOUND')
              tests = tests.replace(destructure_old, destructure_new, 1)

          marker = "date-only monitor timestamps use the Jakarta trading date"
          if marker not in tests:
              tests += """

test('date-only monitor timestamps use the Jakarta trading date', () => {
  const jakartaToday = new Date(Date.now() + 7 * 60 * 60 * 1000).toISOString().slice(0, 10);
  const yesterday = new Date(Date.now() - 24 * 60 * 60 * 1000 + 7 * 60 * 60 * 1000).toISOString().slice(0, 10);
  assert.equal(isMonitorTimestampStale(jakartaToday), false);
  assert.equal(isMonitorTimestampStale(yesterday), true);
  assert.equal(isMonitorTimestampStale('not-a-date'), true);
});
"""
          test_path.write_text(tests)
          PY

          node --check api/sector-hot.js
          node --check lib/idx-tick-normalization.js
          node --check test/idx-tick-setup-freshness.test.js
          node --check test/telegram-monitor-plan-identity.test.js
          node --check test/telegram-monitor-plan-identity-migration.test.js

          node --test \
            test/register-monitor.test.js \
            test/idx-tick-setup-freshness.test.js \
            test/screener-price-freshness.test.js \
            test/telegram-monitor.test.js \
            test/telegram-monitor-dry-run.test.js \
            test/telegram-monitor-dedup.test.js \
            test/telegram-monitor-hourly-batch.test.js \
            test/auto-swing-telegram-digest.test.js \
            test/intraday-plan-lock.test.js \
            test/intraday-plan-lock-decoupling.test.js \
            test/telegram-monitor-plan-identity.test.js \
            test/telegram-monitor-plan-identity-migration.test.js

      - name: Commit correction and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/validate-telegram-monitor-plan-identity.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'NO_CHANGES=TRUE'
            exit 0
          fi
          git commit -m 'test: harden monitor date-only freshness validation'
          git push origin HEAD:fix/telegram-monitor-plan-identity
