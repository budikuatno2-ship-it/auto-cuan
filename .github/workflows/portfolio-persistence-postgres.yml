name: Portfolio persistence PostgreSQL harness
on:
  pull_request:

permissions:
  contents: read

jobs:
  portfolio-persistence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: portfolio_persistence_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d portfolio_persistence_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: portfolio_persistence_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run portfolio persistence Node tests
        run: node --test test/portfolio-supabase-persistence.test.js
      - name: Bootstrap isolated PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f test/sql/admin-access/bootstrap.sql
      - name: Apply portfolio persistence migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/portfolio-state-persistence-migration.sql
      - name: Execute portfolio persistence runtime regression
        run: psql -v ON_ERROR_STOP=1 -f test/sql/portfolio-persistence/runtime.sql
      - name: Re-apply migration against non-empty state
        run: psql -v ON_ERROR_STOP=1 -f supabase/portfolio-state-persistence-migration.sql
      - name: Verify non-empty data survives migration re-apply
        run: |
          psql -v ON_ERROR_STOP=1 -c "SELECT au.username, jsonb_array_length(ps.state->'plans') AS plans FROM public.app_user_portfolio_state ps JOIN public.app_users au ON au.id=ps.user_id WHERE au.username='budi';"
          psql -v ON_ERROR_STOP=1 -c "SELECT relrowsecurity FROM pg_class WHERE oid='public.app_user_portfolio_state'::regclass;"
