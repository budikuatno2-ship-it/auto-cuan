name: UI Stability Final Validation

on:
  pull_request:
    branches:
      - feat/daytrade-screener-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Syntax checks
        run: |
          node --check public/pattern-stable-runtime.js
          node --check public/pattern-screener-extension.js
          node --check public/portfolio-runtime-fix.js
          node --check public/assets/fca-stocks.js
      - name: Focused regression tests
        run: |
          node --test \
            test/pattern-radar.test.js \
            test/pattern-screener-extension.test.js \
            test/portfolio-command-center.test.js \
            test/classic-chart-patterns.test.js \
            test/pattern-ranking-integration.test.js
      - name: Production build gate
        run: npm run build
      - name: API count
        run: test "$(find api -maxdepth 1 -type f -name '*.js' | wc -l | tr -d ' ')" = "12"
