name: UI Stability Final Validation

on:
  pull_request:
    branches:
      - feat/daytrade-screener-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Syntax checks
        run: |
          node --check public/pattern-stable-runtime.js
          node --check public/pattern-screener-extension.js
          node --check public/portfolio-runtime-fix.js
          node --check public/assets/fca-stocks.js
      - name: Pattern Radar tests
        run: node --test test/pattern-radar.test.js
      - name: Pattern enrichment tests
        run: node --test test/pattern-screener-extension.test.js
      - name: Portfolio asset tests
        run: node --test --test-name-pattern="command center v2 assets" test/portfolio-command-center.test.js
      - name: Portfolio access tests
        run: node --test --test-name-pattern="access stays" test/portfolio-command-center.test.js
      - name: Portfolio legacy delete tests
        run: node --test --test-name-pattern="legacy Portfolio plans" test/portfolio-command-center.test.js
      - name: Portfolio calculation tests
        run: node --test --test-name-pattern="rupiah|affordability|average down|scenario module|status and snapshot" test/portfolio-command-center.test.js
      - name: Classic detector tests
        run: node --test test/classic-chart-patterns.test.js
      - name: Ranking integration tests
        run: node --test test/pattern-ranking-integration.test.js
      - name: Production build gate
        run: npm run build
      - name: API count
        run: test "$(find api -maxdepth 1 -type f -name '*.js' | wc -l | tr -d ' ')" = "12"
