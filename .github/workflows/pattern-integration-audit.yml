name: Pattern Integration Audit

on:
  pull_request:
    branches:
      - feat/daytrade-screener-v1

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect existing integrations
        run: |
          {
            echo '=== CANDLE ENGINE REFERENCES ==='
            grep -n -C 12 'candleEngine' api/sector-hot.js || true
            echo '=== SMART SETUP REFERENCES ==='
            grep -n -C 8 'applySmartSetupLabels' api/sector-hot.js || true
          } > pattern-integration-audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pattern-integration-audit
          path: pattern-integration-audit.txt
