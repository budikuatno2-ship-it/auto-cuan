name: Apply Telegram Monitor Plan Identity Patch

on:
  push:
    branches:
      - fix/telegram-monitor-plan-identity
    paths:
      - '.patch/telegram-monitor-plan-identity/**'
      - '.github/workflows/apply-telegram-monitor-plan-identity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/telegram-monitor-plan-identity
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Reassemble and apply patch
        shell: bash
        run: |
          set -euo pipefail
          cat .patch/telegram-monitor-plan-identity/part-* | base64 -d > /tmp/apply-monitor-patch.js
          node --check /tmp/apply-monitor-patch.js
          node /tmp/apply-monitor-patch.js

      - name: Syntax checks
        run: |
          node --check api/sector-hot.js
          node --check lib/idx-tick-normalization.js
          node --check test/idx-tick-setup-freshness.test.js
          node --check test/telegram-monitor-plan-identity.test.js
          node --check test/telegram-monitor-plan-identity-migration.test.js

      - name: Focused regression tests
        run: |
          node --test \
            test/register-monitor.test.js \
            test/idx-tick-setup-freshness.test.js \
            test/screener-price-freshness.test.js \
            test/telegram-monitor.test.js \
            test/telegram-monitor-dry-run.test.js \
            test/telegram-monitor-dedup.test.js \
            test/telegram-monitor-hourly-batch.test.js \
            test/auto-swing-telegram-digest.test.js \
            test/intraday-plan-lock.test.js \
            test/intraday-plan-lock-decoupling.test.js \
            test/telegram-monitor-plan-identity.test.js \
            test/telegram-monitor-plan-identity-migration.test.js

      - name: Commit validated patch to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            api/sector-hot.js \
            lib/idx-tick-normalization.js \
            supabase/telegram-daily-picks-migration.sql \
            test/idx-tick-setup-freshness.test.js \
            test/telegram-monitor-plan-identity.test.js \
            test/telegram-monitor-plan-identity-migration.test.js
          if git diff --cached --quiet; then
            echo 'NO_PATCH_CHANGES=TRUE'
            exit 0
          fi
          git commit -m 'fix: make Telegram monitor plan-aware and freshness-stable'
          git push origin HEAD:fix/telegram-monitor-plan-identity
