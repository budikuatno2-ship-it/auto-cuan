name: Foreign Flow Source Debug (No Production Secrets)

# Production foreign-flow synchronization runs on the Oracle VPS.
# This GitHub workflow is intentionally DEBUG-ONLY and must never receive
# Supabase service-role credentials. It may acquire/inspect source data, but
# it cannot write production data.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Auto-Cuan
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Clone pinned IDX-API snapshot
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/NeaByteLab/IDX-API.git idx-api
          git -C idx-api checkout --detach 910b8db70893b93920a1bba331d00a1a245907c6
          test "$(git -C idx-api rev-parse HEAD)" = "910b8db70893b93920a1bba331d00a1a245907c6"

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Initialize pinned IDX-API database schema
        working-directory: idx-api
        run: |
          set -euo pipefail
          mkdir -p data
          deno run -A npm:drizzle-kit push --config drizzle.config.json

      - name: Copy Auto-Cuan acquisition script
        run: cp scripts/idx-sync/sync_stock_summary_dates.ts idx-api/sync_stock_summary_dates.ts

      - name: Fetch stock summary for diagnostics
        working-directory: idx-api
        run: deno run -A sync_stock_summary_dates.ts

      - name: Validate and summarize local SQLite only
        working-directory: idx-api
        run: |
          python3 <<'PYEOF'
          import os, sqlite3, sys
          db_path = 'data/database.sqlite'
          if not os.path.exists(db_path):
              print('ERROR: database.sqlite not found')
              sys.exit(1)
          conn = sqlite3.connect(db_path)
          try:
              count, max_date = conn.execute('SELECT COUNT(*), MAX(date) FROM stock_summary').fetchone()
              print('stock_summary rows:', count)
              print('latest unix_ms:', max_date)
              if not count:
                  sys.exit(1)
          finally:
              conn.close()
          PYEOF

      - name: Confirm production credentials are intentionally unavailable
        env:
          SUPABASE_SERVICE_ROLE_KEY: ''
          SUPABASE_URL: ''
        run: |
          test -z "$SUPABASE_SERVICE_ROLE_KEY"
          test -z "$SUPABASE_URL"
          echo "Debug workflow completed without production Supabase credentials."
