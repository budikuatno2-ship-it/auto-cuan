name: Sync Foreign Flow to Supabase

on:
  schedule:
    # Weekdays at 10:30 UTC = 17:30 WIB (after BEI market close + data release)
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Comma-separated tickers (empty = all stocks)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry-run mode (preview only, no Supabase writes)'
        required: false
        default: false
        type: boolean

jobs:
  sync-foreign-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout auto-cuan repo
        uses: actions/checkout@v4

      - name: Clone IDX-API
        run: |
          git clone --depth 1 https://github.com/NeaByteLab/IDX-API.git idx-api

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Initialize IDX-API database schema
        working-directory: idx-api
        run: |
          mkdir -p data
          deno run -A npm:drizzle-kit push --config drizzle.config.json

      - name: Create stock summary sync script
        working-directory: idx-api
        run: |
          cat > sync_stock_summary_today.ts << 'SCRIPT'
          import { syncStockSummary } from '@app/Backend/Sync/StockSummary.ts'

          // Get dates in YYYYMMDD format (WIB = UTC+7)
          const now = new Date()
          const wib = new Date(now.getTime() + 7 * 60 * 60 * 1000)

          function formatDate(d: Date): string {
            return d.getFullYear().toString() +
              String(d.getMonth() + 1).padStart(2, '0') +
              String(d.getDate()).padStart(2, '0')
          }

          // Build list of dates to try: today, yesterday, 2 days ago, 3 days ago
          const datesToTry: string[] = []
          for (let i = 0; i <= 3; i++) {
            const d = new Date(wib.getTime() - i * 24 * 60 * 60 * 1000)
            datesToTry.push(formatDate(d))
          }

          console.log(`[sync] Will try dates: ${datesToTry.join(', ')}`)

          let success = false
          for (const dateStr of datesToTry) {
            console.log(`[sync] Attempting syncStockSummary for ${dateStr} ...`)
            try {
              await syncStockSummary(dateStr)
              console.log(`[sync] SUCCESS: Stock summary synced for ${dateStr}.`)
              success = true
              break
            } catch (err) {
              const msg = err instanceof Error ? err.message : String(err)
              console.warn(`[sync] No data for ${dateStr}: ${msg}`)
            }
          }

          if (!success) {
            console.error('[sync] FAILED: Could not sync stock summary for any recent date.')
            Deno.exit(1)
          }
          SCRIPT

      - name: Fetch stock summary from IDX
        working-directory: idx-api
        run: |
          deno run -A sync_stock_summary_today.ts

      - name: Debug - Find SQLite files
        working-directory: idx-api
        if: always()
        run: |
          echo "=== SQLite files found ==="
          find . -maxdepth 5 -type f \( -name "*.db" -o -name "*.sqlite" -o -name "*.sqlite3" \) -print -exec ls -lh {} \;
          echo ""
          echo "=== data/ directory contents ==="
          ls -la data/ 2>/dev/null || echo "data/ directory not found"

      - name: Debug - SQLite table inspection
        working-directory: idx-api
        if: always()
        run: |
          python3 << 'PYEOF'
          import sqlite3, os, glob

          # Find all sqlite files
          sqlite_files = glob.glob('**/*.sqlite', recursive=True) + glob.glob('**/*.db', recursive=True)
          print(f"SQLite files found: {sqlite_files}")

          db_path = 'data/database.sqlite'
          if not os.path.exists(db_path):
              print(f"ERROR: {db_path} not found")
              # Try alternative paths
              for f in sqlite_files:
                  print(f"  Trying: {f}")
                  db_path = f
                  break
              else:
                  exit(0)

          print(f"\nInspecting: {db_path} ({os.path.getsize(db_path)} bytes)")
          conn = sqlite3.connect(db_path)

          # List all tables
          tables = conn.execute("SELECT name FROM sqlite_master WHERE type='table'").fetchall()
          print(f"\nTables ({len(tables)}):")
          for t in tables:
              count = conn.execute(f"SELECT COUNT(*) FROM [{t[0]}]").fetchone()[0]
              print(f"  {t[0]}: {count} rows")

          # Check stock_summary specifically
          print("\n--- stock_summary details ---")
          try:
              cursor = conn.execute('SELECT COUNT(*), MIN(date), MAX(date) FROM stock_summary')
              row = cursor.fetchone()
              count, min_date, max_date = row
              print(f"  Rows: {count}")
              if count > 0 and max_date:
                  from datetime import datetime, timezone, timedelta
                  dt = datetime.fromtimestamp(max_date / 1000, tz=timezone(timedelta(hours=7)))
                  print(f"  Latest date: {dt.strftime('%Y-%m-%d')} (unix_ms: {max_date})")
                  dt_min = datetime.fromtimestamp(min_date / 1000, tz=timezone(timedelta(hours=7)))
                  print(f"  Oldest date: {dt_min.strftime('%Y-%m-%d')} (unix_ms: {min_date})")
              else:
                  print("  Table is empty - IDX may not have returned data for the requested dates")
          except Exception as e:
              print(f"  Error: {e}")

          conn.close()
          PYEOF

      - name: Validate stock_summary has data
        working-directory: idx-api
        run: |
          python3 -c "
          import sqlite3, os, sys
          db_path = 'data/database.sqlite'
          if not os.path.exists(db_path):
            print('ERROR: database.sqlite not found')
            sys.exit(1)
          conn = sqlite3.connect(db_path)
          cursor = conn.execute('SELECT COUNT(*), MAX(date) FROM stock_summary')
          row = cursor.fetchone()
          count, max_date = row
          if count == 0:
            print('ERROR: stock_summary table is empty after sync attempt.')
            print('This may mean IDX has not released data for recent dates yet.')
            print('The workflow will exit. Previous Supabase data remains unchanged.')
            sys.exit(1)
          from datetime import datetime, timezone, timedelta
          dt = datetime.fromtimestamp(max_date / 1000, tz=timezone(timedelta(hours=7)))
          print(f'stock_summary rows: {count}')
          print(f'Latest trade date: {dt.strftime(\"%Y-%m-%d\")} (unix_ms: {max_date})')
          conn.close()
          "

      - name: Copy sync script to IDX-API folder
        run: |
          cp scripts/idx-sync/sync_foreign_flow.py idx-api/sync_foreign_flow.py

      - name: Run Foreign Flow sync to Supabase
        working-directory: idx-api
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""

          # Add tickers if provided
          TICKERS="${{ github.event.inputs.tickers }}"
          if [ -n "$TICKERS" ]; then
            ARGS="$ARGS --tickers $TICKERS"
          fi

          # Add dry-run if requested
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          echo "Running: python3 sync_foreign_flow.py $ARGS"
          python3 sync_foreign_flow.py $ARGS
