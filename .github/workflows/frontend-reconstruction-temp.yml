name: Temporary Frontend Reconstruction

# Temporary branch-only workflow used to reconstruct and validate the reviewed Codex changes.
on:
  push:
    branches:
      - chore/frontend-runtime-decomposition-v1
  pull_request:
    branches:
      - feat/daytrade-screener-v1

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: chore/frontend-runtime-decomposition-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Correct extracted-runtime ownership expectations
        run: |
          sed -i "s/'openChartPageFullscreen', //" tools/reconstruct-codex-frontend-audit.js
          sed -i "s/|openChartPageFullscreen//g" tools/reconstruct-codex-frontend-audit.js

      - name: Reconstruct audited frontend optimizations
        run: node tools/reconstruct-codex-frontend-audit.js

      - name: Align build guards with extracted chart runtime
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const p = 'tools/apply-production-hotfixes.js';
          let s = fs.readFileSync(p, 'utf8');
          const oldLine = `assertOk(index.includes("if (variant === 'fullscreen')"), 'chartDims lost its fullscreen variant.');`;
          const newLine = `assertOk(marketFeatureRuntime.includes("if (variant === 'fullscreen')"), 'chartDims lost its fullscreen variant.');`;
          if (!s.includes(oldLine)) throw new Error('chartDims validator baseline not found');
          s = s.replace(oldLine, newLine);
          fs.writeFileSync(p, s);
          NODE

      - name: Syntax-check extracted runtime
        run: node --check public/market-feature-runtime.js

      - name: Run focused reconstruction tests
        run: node --test test/frontend-runtime-decomposition.test.js

      - name: Run full production build gate
        run: npm run build

      - name: Re-run focused tests after build transforms
        run: node --test test/frontend-runtime-decomposition.test.js

      - name: Validate diff
        run: git diff --check

      - name: Remove temporary reconstruction automation
        run: rm -f tools/reconstruct-codex-frontend-audit.js .github/workflows/frontend-reconstruction-temp.yml

      - name: Commit reconstructed source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No reconstructed changes to commit"
            exit 1
          fi
          git commit -m "Reconstruct audited frontend runtime optimizations"
          git push origin HEAD:chore/frontend-runtime-decomposition-v1
