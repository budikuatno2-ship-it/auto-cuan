name: Apply Top5 History Fix 2026-08-21

on:
  push:
    branches:
      - fix/top5-history-full-audit-20260821
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/top5-history-full-audit-20260821
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Apply exact Top 5 History patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('api/sector-hot.js')
          src = path.read_text()
          anchor = "async function handleWebTop5History(req, res, supabase) {"
          if anchor not in src:
              raise SystemExit('handleWebTop5History anchor missing')
          if 'async function buildWebTop5HistoryCollections(' not in src:
              helper = r'''function getPersistedWebTop5HistoryBucket(row) {
            row = row || {};
            var status = String(row.status || '').toUpperCase();
            function hitMs(value) {
              if (!value) return null;
              var ms = Date.parse(value);
              return Number.isFinite(ms) ? ms : null;
            }
            var tp2At = hitMs(row.hit_tp2_at);
            var tp1At = hitMs(row.hit_tp1_at);
            var slAt = hitMs(row.hit_sl_at);
            if (tp2At != null && (slAt == null || tp2At <= slAt)) return 'tp';
            if (tp1At != null && (slAt == null || tp1At <= slAt)) return 'tp';
            if (slAt != null) return 'failed';
            if (status === 'TP2_HIT' || status === 'TP1_HIT') return 'tp';
            if (status === 'SL_HIT') return 'failed';
            return null;
          }

          async function buildWebTop5HistoryCollections(rows, limit, priceFetcher) {
            rows = Array.isArray(rows) ? rows : [];
            limit = parseInt(limit, 10);
            if (!isFinite(limit) || limit <= 0) limit = 100;
            if (limit > 300) limit = 300;
            if (typeof priceFetcher !== 'function') throw new Error('history_price_fetcher_required');

            var activeHistory = [];
            var tpRows = [];
            var seenActiveTickers = Object.create(null);
            var pricePromiseByTicker = Object.create(null);
            var scannedCount = 0;
            var CHUNK = 10;
            var unavailable = { last: null, open: null, high: null, low: null, at: null, bestEffort: true, source: 'unavailable' };

            function tickerKey(row) {
              return String(row && row.ticker || (row && row.raw_payload && row.raw_payload.ticker) || '').trim().toUpperCase();
            }

            function priceFor(row) {
              var key = tickerKey(row);
              if (!key) return Promise.resolve(unavailable);
              if (!pricePromiseByTicker[key]) {
                pricePromiseByTicker[key] = Promise.resolve().then(function() {
                  return priceFetcher(row);
                });
              }
              return pricePromiseByTicker[key];
            }

            for (var ci = 0; ci < rows.length; ci += CHUNK) {
              if (activeHistory.length >= limit && tpRows.length >= 10) break;
              var chunk = rows.slice(ci, ci + CHUNK);
              var jobs = chunk.map(function(row) {
                var persistedBucket = getPersistedWebTop5HistoryBucket(row);
                // Persisted SL is authoritative and the row is not returned in either
                // public history bucket, so a live-price round trip cannot change the
                // response and is pure wasted I/O.
                if (persistedBucket === 'failed') return Promise.resolve(unavailable);
                // Once TP History is full, persisted TP rows cannot displace newer TP
                // rows because input is already ordered newest-first.
                if (persistedBucket === 'tp' && tpRows.length >= 10) return Promise.resolve(unavailable);
                return priceFor(row);
              });
              var prices = await Promise.allSettled(jobs);

              for (var cj = 0; cj < chunk.length; cj++) {
                scannedCount++;
                var px = prices[cj].status === 'fulfilled' && prices[cj].value
                  ? prices[cj].value
                  : unavailable;
                var built = buildWebTop5HistoryRow(chunk[cj], 0, px, null);
                if (built.history_bucket === 'tp') {
                  if (tpRows.length < 10) {
                    built.rank = tpRows.length + 1;
                    tpRows.push(built);
                  }
                } else if (built.history_bucket === 'active' && activeHistory.length < limit) {
                  var key = String(built.ticker || '').trim().toUpperCase();
                  if (!key) key = 'row-' + String(built.id || '');
                  if (!seenActiveTickers[key]) {
                    seenActiveTickers[key] = true;
                    built.rank = activeHistory.length + 1;
                    activeHistory.push(built);
                  }
                }
              }
            }

            return {
              active_history: activeHistory,
              tp_history: tpRows,
              price_fetch_count: Object.keys(pricePromiseByTicker).length,
              scanned_count: scannedCount
            };
          }

          '''
              src = src.replace(anchor, helper + anchor, 1)

          old = r'''    var activeRows = [];
            var tpRows = [];
            // Parallelize price fetches in bounded chunks (was sequential — caused ~1min load for many rows)
            var _historyStartMs = Date.now();
            var CHUNK = 10;
            var builtRows = [];
            for (var ci = 0; ci < rows.length; ci += CHUNK) {
              var chunk = rows.slice(ci, ci + CHUNK);
              var chunkPrices = await Promise.allSettled(chunk.map(function(r) { return fetchLatestPriceForMonitor(supabase, r.ticker); }));
              for (var cj = 0; cj < chunk.length; cj++) {
                var cpx = chunkPrices[cj].status === 'fulfilled' ? chunkPrices[cj].value : { last: null, open: null, high: null, low: null, at: null, bestEffort: true };
                builtRows.push(buildWebTop5HistoryRow(chunk[cj], 0, cpx, null));
              }
            }
            for (var bi = 0; bi < builtRows.length; bi++) {
              var brow = builtRows[bi];
              if (brow.history_bucket === 'tp') tpRows.push(brow);
              else if (brow.history_bucket === 'active') activeRows.push(brow);
            }
            var seenTickers = {};
            var activeHistory = [];
            for (var a = 0; a < activeRows.length; a++) {
              var tickerKey = String(activeRows[a].ticker || '').trim().toUpperCase();
              if (!tickerKey) tickerKey = 'row-' + String(activeRows[a].id || '');
              if (seenTickers[tickerKey]) continue;
              seenTickers[tickerKey] = true;
              activeRows[a].rank = activeHistory.length + 1;
              activeHistory.push(activeRows[a]);
              if (activeHistory.length >= limit) break;
            }
            tpRows = tpRows.slice(0, 10).map(function(r, idx) { r.rank = idx + 1; return r; });'''
          new = r'''    var _historyStartMs = Date.now();
            var collections = await buildWebTop5HistoryCollections(rows, limit, function(r) {
              return fetchLatestPriceForMonitor(supabase, r.ticker);
            });
            var activeHistory = collections.active_history;
            var tpRows = collections.tp_history;'''
          if old not in src:
              raise SystemExit('old Top5 history hydration block not found exactly')
          src = src.replace(old, new, 1)

          export_old = "  classifyWebTop5History: classifyWebTop5History,\n  buildWebTop5HistoryRow: buildWebTop5HistoryRow\n};"
          export_new = "  classifyWebTop5History: classifyWebTop5History,\n  buildWebTop5HistoryRow: buildWebTop5HistoryRow,\n  getPersistedWebTop5HistoryBucket: getPersistedWebTop5HistoryBucket,\n  buildWebTop5HistoryCollections: buildWebTop5HistoryCollections\n};"
          if export_old not in src:
              raise SystemExit('__test Top5 export anchor missing')
          src = src.replace(export_old, export_new, 1)
          path.write_text(src)

          test = Path('test/top5-history-performance.test.js')
          test.write_text(r'''\'use strict\';

          const test = require('node:test');
          const assert = require('node:assert/strict');
          const sectorHot = require('../api/sector-hot').__test;

          function row(id, ticker, extra) {
            return Object.assign({
              id,
              date: '2026-08-21',
              ticker,
              category: 'daytrade',
              entry1: 100,
              entry2: 98,
              sl: 95,
              tp1: 105,
              tp2: 110,
              status: 'WAITING',
              first_sent_at: '2026-08-21T01:00:00.000Z',
              raw_payload: {}
            }, extra || {});
          }

          test('Top5 history fetches live price once per unique ticker instead of once per history row', async () => {
            const rows = [];
            for (let i = 0; i < 300; i++) rows.push(row(i + 1, ['AAA', 'BBB', 'CCC'][i % 3]));
            let calls = 0;
            const result = await sectorHot.buildWebTop5HistoryCollections(rows, 100, async (r) => {
              calls++;
              return { last: 101, open: 100, high: 102, low: 99, at: '2026-08-21T04:00:00.000Z', bestEffort: false };
            });
            assert.equal(calls, 3);
            assert.equal(result.price_fetch_count, 3);
            assert.equal(result.active_history.length, 3);
            assert.deepEqual(result.active_history.map(r => r.ticker), ['AAA', 'BBB', 'CCC']);
          });

          test('persisted SL history rows do not perform pointless live-price I/O', async () => {
            const rows = Array.from({ length: 120 }, (_, i) => row(i + 1, 'SL' + i, {
              status: 'SL_HIT',
              hit_sl_at: '2026-08-21T03:00:00.000Z'
            }));
            let calls = 0;
            const result = await sectorHot.buildWebTop5HistoryCollections(rows, 100, async () => {
              calls++;
              return { last: 101, high: 102, low: 99 };
            });
            assert.equal(calls, 0);
            assert.equal(result.active_history.length, 0);
            assert.equal(result.tp_history.length, 0);
          });

          test('TP history remains newest-first and capped at ten while active history obeys requested limit', async () => {
            const rows = [];
            for (let i = 0; i < 12; i++) rows.push(row(i + 1, 'TP' + i, {
              status: 'TP1_HIT',
              hit_tp1_at: '2026-08-21T02:00:00.000Z'
            }));
            rows.push(row(100, 'ACTIVE1'));
            rows.push(row(101, 'ACTIVE2'));
            const result = await sectorHot.buildWebTop5HistoryCollections(rows, 1, async () => ({
              last: 101, open: 100, high: 102, low: 99, at: '2026-08-21T04:00:00.000Z', bestEffort: false
            }));
            assert.equal(result.tp_history.length, 10);
            assert.deepEqual(result.tp_history.map(r => r.ticker), Array.from({ length: 10 }, (_, i) => 'TP' + i));
            assert.equal(result.active_history.length, 1);
            assert.equal(result.active_history[0].ticker, 'ACTIVE1');
            assert.equal(result.active_history[0].rank, 1);
          });

          test('persisted TP/SL chronology keeps SL-first rows out of TP history', async () => {
            const rows = [row(1, 'RACE', {
              status: 'TP1_HIT',
              hit_tp1_at: '2026-08-21T04:01:00.000Z',
              hit_sl_at: '2026-08-21T04:00:00.000Z'
            })];
            let calls = 0;
            const result = await sectorHot.buildWebTop5HistoryCollections(rows, 100, async () => {
              calls++;
              return { last: 120, high: 120, low: 90 };
            });
            assert.equal(calls, 0);
            assert.equal(result.tp_history.length, 0);
            assert.equal(result.active_history.length, 0);
          });
          '''.replace(/^          /gm, ''))
          PY

      - name: Verify focused regression and production build
        shell: bash
        run: |
          set -euo pipefail
          node --check api/sector-hot.js
          node --test test/top5-history-performance.test.js test/audit-cron-and-top5-lock.test.js test/telegram-monitor-delivery-order.test.js
          npm run build
          git diff --check

      - name: Commit verified product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/sector-hot.js test/top5-history-performance.test.js
          if git diff --cached --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git commit -m 'fix: bound Top 5 history price hydration'
          git push origin HEAD:fix/top5-history-full-audit-20260821
