name: One-shot remaining audit hardening

on:
  push:
    branches:
      - claude/repo-audit-skills-5c832e
    paths:
      - .github/workflows/one-shot-audit-hardening.yml
  pull_request:
    branches:
      - feat/daytrade-screener-v1
    paths:
      - .github/workflows/one-shot-audit-hardening.yml
      - tools/one-shot-audit-hardening.py
      - lib/password-credential.js
      - test/password-credential.test.js

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: claude/repo-audit-skills-5c832e
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Correct temporary patch anchor and apply hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/one-shot-audit-hardening.py')
          s = p.read_text()
          start = s.index('needle = """      return res.status(400).json({ success: false, error: GENERIC_CREDENTIAL_ERROR });')
          end = s.index('p.write_text(s)', start)
          replacement = '''anchor = "    // Database credentials are valid from here on. Clear account/pair failure\\n"
          pos = s.find(anchor, s.find('const credentialCheck'))
          if pos < 0:
              raise SystemExit('login database-credentials anchor not found')
          upgrade = """    // Transparent migration: legacy rows stored the client SHA-256 prehash itself,\n    // which made a DB read equivalent to a login credential. After successful\n    // verification, replace it with a salted server-side scrypt credential.\n    if (credentialCheck.needsUpgrade) {\n      try {\n        const protectedCredential = passwordCredential.protectClientHash(passwordHash);\n        const upgraded = await supabase\n          .from('app_users')\n          .update({ password_hash: protectedCredential })\n          .eq('id', user.id)\n          .eq('password_hash', user.password_hash);\n        if (upgraded.error) console.error('login-user credential migration failed');\n      } catch (_) {\n        console.error('login-user credential migration failed');\n      }\n    }\n\n"""\n          s = s[:pos] + upgrade + s[pos:]\n'''
          p.write_text(s[:start] + replacement + s[end:])
          PY
          python3 tools/one-shot-audit-hardening.py

      - name: Run focused audit regressions
        run: >-
          node --test
          test/password-credential.test.js
          test/audit-auth-device-route.test.js
          test/audit-portfolio-concurrency.test.js
          test/audit-cron-and-top5-lock.test.js
          test/ai-narration-idx-price-band.test.js
          test/telegram-monitor-delivery-order.test.js
          test/telegram-notifier-rate-limit.test.js
          test/trade-plan-v2-declared-guards.test.js
          test/ai-context-snapshot-ticker-scope.test.js
          test/public-screener-share-ranking.test.js

      - name: Run production build gate
        run: npm run build

      - name: Verify no temporary/debug drift
        shell: bash
        run: |
          git diff --check
          if git diff | grep -E '^\+.*(console\.log\(|debugger;|BEGIN PRIVATE KEY|ghp_)'; then
            echo 'Unexpected debug/secret-like addition'
            exit 1
          fi

      - name: Commit verified patch and remove temporary worker
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-audit-hardening.yml tools/one-shot-audit-hardening.py
          git add api/reset-password.js public/auth-v2.js api/login-user.js api/register-user.js lib/reset-password-legacy-handler.js lib/security-guard.js lib/portfolio-state-handler.js public/portfolio-supabase-sync.js api/sector-hot.js test/audit-auth-device-route.test.js test/audit-portfolio-concurrency.test.js test/audit-cron-and-top5-lock.test.js
          git commit -m "fix: close auth concurrency and scheduler audit gaps"
          git push origin HEAD:claude/repo-audit-skills-5c832e
