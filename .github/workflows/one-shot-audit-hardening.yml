name: One-shot remaining audit hardening

on:
  push:
    branches:
      - claude/repo-audit-skills-5c832e
    paths:
      - .github/workflows/one-shot-audit-hardening.yml
  pull_request:
    branches:
      - feat/daytrade-screener-v1
    paths:
      - .github/workflows/one-shot-audit-hardening.yml
      - tools/one-shot-audit-hardening.py
      - lib/password-credential.js
      - test/password-credential.test.js

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: claude/repo-audit-skills-5c832e
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Apply deterministic audit hardening patch
        run: python3 tools/one-shot-audit-hardening.py

      - name: Run focused audit regressions
        run: >-
          node --test
          test/password-credential.test.js
          test/audit-auth-device-route.test.js
          test/audit-portfolio-concurrency.test.js
          test/audit-cron-and-top5-lock.test.js
          test/ai-narration-idx-price-band.test.js
          test/telegram-monitor-delivery-order.test.js
          test/telegram-notifier-rate-limit.test.js
          test/trade-plan-v2-declared-guards.test.js
          test/ai-context-snapshot-ticker-scope.test.js
          test/public-screener-share-ranking.test.js

      - name: Run production build gate
        run: npm run build

      - name: Verify no temporary/debug drift
        shell: bash
        run: |
          git diff --check
          if git diff | grep -E '^\+.*(console\.log\(|debugger;|BEGIN PRIVATE KEY|ghp_)'; then
            echo 'Unexpected debug/secret-like addition'
            exit 1
          fi

      - name: Commit verified patch and remove temporary worker
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-audit-hardening.yml tools/one-shot-audit-hardening.py
          git add api/reset-password.js public/auth-v2.js api/login-user.js api/register-user.js lib/reset-password-legacy-handler.js lib/security-guard.js lib/portfolio-state-handler.js public/portfolio-supabase-sync.js api/sector-hot.js test/audit-auth-device-route.test.js test/audit-portfolio-concurrency.test.js test/audit-cron-and-top5-lock.test.js
          git commit -m "fix: close auth concurrency and scheduler audit gaps"
          git push origin HEAD:claude/repo-audit-skills-5c832e
