name: Temporary Phase 6A.4 hardening

on:
  pull_request:
    types: [synchronize]
    branches: [feat/daytrade-screener-v1]

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.ref == 'codex/implement-subscription-plans-ui' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/implement-subscription-plans-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply hardening patch
        run: python3 .github/scripts/phase6a4_hardening.py
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate access controls and regressions
        run: |
          npm run build
          git diff --check
          node --check api/login-user.js
          node --check api/sector-hot.js
          node --check lib/subscription-auth.js
          node --test test/subscription-phase6a-access.test.js
          node --test test/subscription-phase6a-ui.test.js test/subscription-phase6a-runtime.test.js test/subscription-auth.test.js test/subscription-phase5c.test.js test/ui-redesign-a11y.test.js test/subscription-phase2.test.js test/subscription-phase5a.test.js test/production-loader-hotfix.test.js
          test "$(find api -maxdepth 1 -type f -name '*.js' | wc -l | tr -d ' ')" = "12"
          ! grep -RniE 'Trial 17 Hari|17 hari · aktivasi mengikuti server|Kelola Subscription|pembayaran online hadir di fase berikutnya' public test --exclude-dir=node_modules
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/scripts/phase6a4_hardening.py
          git add -A
          git commit -m 'fix: harden premium access lifecycle'
          git push origin HEAD:codex/implement-subscription-plans-ui
