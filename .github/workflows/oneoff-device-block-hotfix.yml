name: One-off recurring false-block hotfix

on:
  push:
    branches: [feat/daytrade-screener-v1]
    paths:
      - '.github/workflows/oneoff-device-block-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/daytrade-screener-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Remove unsafe persistent client device block
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('public/index.html')
          text = path.read_text(encoding='utf-8')

          old_block = """// ===== DEVICE BLOCKING =====
          function getBlockedUntil() { return Number(localStorage.getItem('autocuan_blocked_until') || '0'); }
          function isDeviceBlocked() { var b = getBlockedUntil(); return b && Date.now() < b; }
          function blockDeviceForBadName() {
              localStorage.setItem('autocuan_blocked_until', String(Date.now() + 2*60*60*1000));
              localStorage.removeItem('autocuan_logged_in'); localStorage.removeItem('autocuan_user');
              localStorage.removeItem('autocuan_is_admin'); localStorage.removeItem('autocuan_login_time'); localStorage.removeItem('autocuan_user_id');
              showBlockedScreen();
          }
          """
          new_block = """// ===== LEGACY DEVICE-BLOCK CLEANUP =====
          // A browser-local flag must never decide account access. Older builds stored a
          // two-hour block in localStorage after client-side name validation; clear that
          // stale state and leave authoritative login/account decisions to the server.
          function clearLegacyDeviceBlock() { try { localStorage.removeItem('autocuan_blocked_until'); } catch (_) {} }
          function getBlockedUntil() { clearLegacyDeviceBlock(); return 0; }
          function isDeviceBlocked() { clearLegacyDeviceBlock(); return false; }
          function blockDeviceForBadName() { clearLegacyDeviceBlock(); }
          clearLegacyDeviceBlock();
          """
          if old_block not in text:
              raise SystemExit('device blocking block not found')
          text = text.replace(old_block, new_block, 1)

          replacements = [
              ("    if (isDeviceBlocked()) { showBlockedScreen(); return; }\n    var usernameInput = document.getElementById('loginUsername').value.trim();",
               "    clearLegacyDeviceBlock();\n    var usernameInput = document.getElementById('loginUsername').value.trim();"),
              ("    if (usernameLower !== 'review' && usernameLower !== 'budi' && isBadUsername(usernameInput)) { closeLoginModal(); blockDeviceForBadName(); return; }\n",
               "    // Existing accounts are authenticated by the server. Do not locally block a\n    // device or reject a stored account using a browser-only name heuristic.\n"),
              ("    if (isDeviceBlocked()) { showBlockedScreen(); return; }\n    var usernameInput = document.getElementById('regUsername').value.trim();",
               "    clearLegacyDeviceBlock();\n    var usernameInput = document.getElementById('regUsername').value.trim();"),
              ("    if (isBadUsername(usernameInput)) { closeRegisterModal(); blockDeviceForBadName(); return; }",
               "    if (isBadUsername(usernameInput)) { errorEl.textContent = 'Nama yang digunakan tidak sesuai ketentuan.'; errorEl.classList.remove('hidden'); return; }"),
              ("    if (!isReview && isDeviceBlocked()) { showBlockedScreen(); return; }\n    setTopLevelView('app');",
               "    clearLegacyDeviceBlock();\n    setTopLevelView('app');")
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit('expected hotfix target not found: ' + old[:80])
              text = text.replace(old, new, 1)

          if "localStorage.setItem('autocuan_blocked_until'" in text:
              raise SystemExit('persistent device block still present')
          path.write_text(text, encoding='utf-8')

          test = Path('test/device-block-regression.test.js')
          test.write_text("""'use strict';
          const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const html = fs.readFileSync(path.join(__dirname, '..', 'public', 'index.html'), 'utf8');

          test('legacy browser device block is cleared and can no longer deny access', () => {
            assert.match(html, /function clearLegacyDeviceBlock\(\)/);
            assert.match(html, /function isDeviceBlocked\(\) \{ clearLegacyDeviceBlock\(\); return false; \}/);
            assert.doesNotMatch(html, /localStorage\.setItem\('autocuan_blocked_until'/);
            assert.doesNotMatch(html, /if \(!isReview && isDeviceBlocked\(\)\) \{ showBlockedScreen\(\); return; \}/);
          });

          test('login trusts server authentication and registration errors remain inline', () => {
            assert.doesNotMatch(html, /usernameLower !== 'review'[\s\S]{0,180}blockDeviceForBadName/);
            assert.match(html, /if \(isBadUsername\(usernameInput\)\) \{ errorEl\.textContent = 'Nama yang digunakan tidak sesuai ketentuan\.'/);
          });
          """, encoding='utf-8')
          PY
      - name: Validate hotfix
        run: |
          npm ci --ignore-scripts
          npm run build
          git diff --check
          node --test test/device-block-regression.test.js
          node --test test/production-loader-hotfix.test.js test/subscription-phase6a-ui.test.js test/subscription-phase6a-access.test.js
      - name: Commit hotfix and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/oneoff-device-block-hotfix.yml
          git add public/index.html test/device-block-regression.test.js
          git commit -m 'fix: remove recurring client-side false block'
          git push origin HEAD:feat/daytrade-screener-v1
