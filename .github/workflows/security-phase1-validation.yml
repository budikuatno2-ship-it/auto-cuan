name: Security Phase 1 Validation

on:
  pull_request:
    branches:
      - feat/daytrade-screener-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Syntax check
        run: |
          node --check lib/security-guard.js
          node --check api/login-user.js
          node --check api/admin-logs.js
          node --check public/security-admin-runtime.js
          node --check test/security-guard.test.js
          node --check test/security-phase1.test.js

      - name: Focused security tests
        run: node --test test/security-guard.test.js test/security-phase1.test.js

      - name: Existing auth tests
        run: |
          set -e
          files=""
          for file in test/admin-session.test.js test/login-user*.test.js test/*auth*.test.js; do
            if [ -f "$file" ]; then files="$files $file"; fi
          done
          if [ -n "$files" ]; then node --test $files; else echo "No matching auth tests found"; fi

      - name: Production build gate
        run: npm run build

      - name: API count
        run: |
          count=$(find api -maxdepth 1 -type f -name '*.js' | wc -l)
          echo "TOTAL_API_ENDPOINTS=$count"
          test "$count" -eq 12
