name: Temporary Premium Workstation V3

on:
  push:
    branches:
      - redesign/premium-workstation-v1

permissions:
  contents: write

jobs:
  validate-v3:
    if: ${{ !contains(github.event.head_commit.message || '', '[premium-v3-worker]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: redesign/premium-workstation-v1
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wire V3 asset and regression guards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          html_path = Path('public/index.html')
          html = html_path.read_text()
          base = '<link rel="stylesheet" href="/premium-workstation.css?v=20260818-v1">'
          v3 = '    <link rel="stylesheet" href="/premium-workstation-v3.css?v=20260818-v3">'
          if '/premium-workstation-v3.css?v=20260818-v3' not in html:
              if base not in html:
                  raise SystemExit('premium workstation base link missing')
              html = html.replace(base, base + '\n' + v3, 1)
              html_path.write_text(html)

          test_path = Path('test/premium-workstation-ui.test.js')
          test = test_path.read_text()
          marker = "premium workstation V3 finishing layer is loaded last"
          if marker not in test:
              test += r'''\n\ntest('premium workstation V3 finishing layer is loaded last', () => {\n  const html = read('public/index.html');\n  const baseAt = html.indexOf('/premium-workstation.css?v=20260818-v1');\n  const v3At = html.indexOf('/premium-workstation-v3.css?v=20260818-v3');\n  assert.ok(baseAt > 0, 'premium workstation base stylesheet missing');\n  assert.ok(v3At > baseAt, 'V3 finishing layer must load after the base premium stylesheet');\n  assert.equal((html.match(/premium-workstation-v3\\.css\\?v=20260818-v3/g) || []).length, 1);\n\n  const css = read('public/premium-workstation-v3.css');\n  assert.match(css, /Premium Workstation V3 finishing layer/);\n  assert.match(css, /content-visibility:\\s*auto/);\n  assert.match(css, /#rankingTableWrap th:first-child/);\n  assert.match(css, /prefers-contrast:\\s*more/);\n  assert.doesNotMatch(css, /fetch\\s*\\(|addEventListener|setInterval|setTimeout|supabase/i);\n});\n'''
              test_path.write_text(test)

          config_path = Path('vercel.json')
          config = json.loads(config_path.read_text())
          headers = config.setdefault('headers', [])
          if not any(row.get('source') == '/premium-workstation-v3.css' for row in headers):
              headers.append({
                  'source': '/premium-workstation-v3.css',
                  'headers': [{
                      'key': 'Cache-Control',
                      'value': 'public, max-age=86400, stale-while-revalidate=604800'
                  }]
              })
              config_path.write_text(json.dumps(config, indent=2) + '\n')
          PY
      - name: Focused premium UI tests
        run: node --test test/premium-workstation-ui.test.js test/repo-security-hardening.test.js
      - name: Production build gate
        run: npm run build
      - name: Diff whitespace check
        run: git diff --check
      - name: Commit validated V3 wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html test/premium-workstation-ui.test.js vercel.json
          if git diff --cached --quiet; then
            echo "No V3 wiring changes"
            exit 0
          fi
          git commit -m "feat: wire premium workstation V3 [premium-v3-worker]"
          git push origin HEAD:redesign/premium-workstation-v1
