name: Pattern Resume Final Validation

on:
  pull_request:
    branches:
      - feat/daytrade-screener-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Syntax checks
        run: |
          node --check public/pattern-tab-resume-guard.js
          node --check public/pattern-screener-extension.js
          node --check public/assets/fca-stocks.js
          node --check test/pattern-tab-resume-guard.test.js
          node --check test/pattern-radar.test.js
          node --check test/pattern-screener-extension.test.js
      - name: Pattern tab resume tests
        run: node --test test/pattern-tab-resume-guard.test.js
      - name: Pattern Radar tests
        run: node --test test/pattern-radar.test.js
      - name: Pattern Screener enrichment tests
        run: node --test test/pattern-screener-extension.test.js
      - name: Classic detector tests
        run: node --test test/classic-chart-patterns.test.js
      - name: Ranking integration tests
        run: node --test test/pattern-ranking-integration.test.js
      - name: Production build gate
        run: npm run build
      - name: API count
        run: test "$(find api -maxdepth 1 -type f -name '*.js' | wc -l | tr -d ' ')" = "12"
