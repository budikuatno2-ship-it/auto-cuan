name: Apply Claude production audit 3002941

on:
  pull_request:
    branches:
      - audit-trigger-base
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-claude-audit-3002941
  cancel-in-progress: false

jobs:
  apply-audit:
    if: github.head_ref == 'agent/apply-claude-audit-3002941'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout payload branch
        uses: actions/checkout@v4
        with:
          ref: agent/apply-claude-audit-3002941
          fetch-depth: 0

      - name: Verify payload file count
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .audit-payload -maxdepth 1 -name 'patch.exact.*' | wc -l | tr -d ' ')" = '5'

      - name: Normalize audit base64 parts
        shell: bash
        run: |
          set -euo pipefail
          for n in 00 01 02 03 04; do
            tr -d '\r\n\t ' < ".audit-payload/patch.exact.${n}" > "/tmp/part.${n}"
            test -s "/tmp/part.${n}"
          done
          cat /tmp/part.00 /tmp/part.01 /tmp/part.02 /tmp/part.03 /tmp/part.04 > /tmp/audit.patch.gz.b64

      - name: Verify base64 alphabet and boundaries
        shell: bash
        run: |
          set -euo pipefail
          ! LC_ALL=C grep -q '[^A-Za-z0-9+/=]' /tmp/audit.patch.gz.b64
          ! grep -q '=' /tmp/part.00
          ! grep -q '=' /tmp/part.01
          ! grep -q '=' /tmp/part.02
          ! grep -q '=' /tmp/part.03

      - name: Restore final base64 padding
        shell: bash
        run: |
          set -euo pipefail
          LEN="$(wc -c < /tmp/audit.patch.gz.b64 | tr -d ' ')"
          REM=$((LEN % 4))
          if [ "${REM}" -ne 0 ]; then
            PAD=$((4 - REM))
            printf '%*s' "${PAD}" '' | tr ' ' '=' >> /tmp/audit.patch.gz.b64
          fi
          LEN="$(wc -c < /tmp/audit.patch.gz.b64 | tr -d ' ')"
          test $((LEN % 4)) -eq 0

      - name: Decode audit base64
        shell: bash
        run: |
          set -euo pipefail
          base64 -d /tmp/audit.patch.gz.b64 > /tmp/audit.patch.gz
          test -s /tmp/audit.patch.gz

      - name: Decompress audit patch
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc /tmp/audit.patch.gz > /tmp/audit.patch
          test -s /tmp/audit.patch

      - name: Decode exact commit object
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\r\n\t ' < .audit-payload/commit.raw.b64 > /tmp/commit.raw.b64
          LEN="$(wc -c < /tmp/commit.raw.b64 | tr -d ' ')"
          REM=$((LEN % 4))
          if [ "${REM}" -ne 0 ]; then
            PAD=$((4 - REM))
            printf '%*s' "${PAD}" '' | tr ' ' '=' >> /tmp/commit.raw.b64
          fi
          base64 -d /tmp/commit.raw.b64 > /tmp/commit.raw
          test -s /tmp/commit.raw

      - name: Verify exact audit checksum
        shell: bash
        run: |
          set -euo pipefail
          echo '6666b48f835dadb971440d9f9e0d9bc81f69a2eb462a06bdb25e146417104e5a  /tmp/audit.patch' | sha256sum -c -

      - name: Apply audit to exact production base
        shell: bash
        env:
          BASE_COMMIT: ac67e23a702aa265dad8046f02ca6eb98636ecd4
          TARGET_TREE: 2526c4d7a532de8c8443090805e9785e021eeafe
          TARGET_COMMIT: 300294115d1be85cc588d7c2d339df410a6a7e8a
          TARGET_BRANCH: feat/daytrade-screener-v1
        run: |
          set -euo pipefail
          git fetch origin "${TARGET_BRANCH}"
          CURRENT="$(git rev-parse "origin/${TARGET_BRANCH}")"
          test "${CURRENT}" = "${BASE_COMMIT}"
          git checkout --detach "${BASE_COMMIT}"
          git apply --index --binary /tmp/audit.patch
          test "$(git write-tree)" = "${TARGET_TREE}"
          COMMIT="$(git hash-object -t commit -w /tmp/commit.raw)"
          test "${COMMIT}" = "${TARGET_COMMIT}"

      - name: Validate audited result
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build
          npm run build
          test "$(find api -maxdepth 1 -type f -name '*.js' | wc -l | tr -d ' ')" = '12'
          node --test test/website-production-audit.test.js
          test "$(git write-tree)" = '2526c4d7a532de8c8443090805e9785e021eeafe'

      - name: Push exact audited commit
        shell: bash
        env:
          BASE_COMMIT: ac67e23a702aa265dad8046f02ca6eb98636ecd4
          TARGET_COMMIT: 300294115d1be85cc588d7c2d339df410a6a7e8a
          TARGET_BRANCH: feat/daytrade-screener-v1
        run: |
          set -euo pipefail
          git update-ref "refs/heads/${TARGET_BRANCH}" "${TARGET_COMMIT}" "${BASE_COMMIT}"
          git push origin "refs/heads/${TARGET_BRANCH}:refs/heads/${TARGET_BRANCH}"
