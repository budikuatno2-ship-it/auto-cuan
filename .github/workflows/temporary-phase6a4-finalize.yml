name: Temporary Phase 6A.4 finalizer

on:
  pull_request:
    types: [synchronize]
    branches: [feat/daytrade-screener-v1]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'codex/implement-subscription-plans-ui' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/implement-subscription-plans-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Close unknown-action fallthrough
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sector_path = Path('api/sector-hot.js')
          sector = sector_path.read_text(encoding='utf-8')
          marker = '// ===== ACTION ALLOWLIST (PHASE 6A.4) ====='
          if marker not in sector:
              anchor = """    const action = req.query.action || null;
    const groupCode = req.query.group || null;

"""
              replacement = anchor + """    // ===== ACTION ALLOWLIST (PHASE 6A.4) =====
    // Unknown actions must never fall through to the default Sektor Hot list/detail
    // response, because that would bypass the premium read policy.
    const knownActions = new Set([
      'telegram-webhook', 'telegram-daily-picks', 'telegram-monitor-picks',
      'web-daily-picks', 'web-top5-history', 'web-top5-history-archive',
      'screener', 'refresh-screener', 'nk-screener-run', 'nk-screener-results',
      'foreign-import-upload', 'daytrade-screener', 'daytrade-screener-run',
      'create-screener-share-link', 'public-screener-share', 'refresh', 'debug-members'
    ]);
    if (action !== null && !knownActions.has(action)) {
      return res.status(400).json({ success: false, error: 'Aksi tidak valid.' });
    }

"""
              if sector.count(anchor) != 1:
                  raise SystemExit('sector action anchor not unique')
              sector = sector.replace(anchor, replacement, 1)
          sector = sector.replace('// === DAY TRADE SCREENER: READ (public — returns latest results) ===', '// === DAY TRADE SCREENER: READ (premium browser read) ===')
          sector_path.write_text(sector, encoding='utf-8')

          test_path = Path('test/subscription-phase6a-access.test.js')
          tests = test_path.read_text(encoding='utf-8')
          test_name = "unknown sector-hot actions cannot fall through to premium list or detail payloads"
          if test_name not in tests:
              tests += """

test('unknown sector-hot actions cannot fall through to premium list or detail payloads', async () => withSessionSecret(async () => {
  await withApiHandler('../api/sector-hot', database(account(), []), async handler => {
    for (const query of [{ action: 'unknown-action' }, { action: 'unknown-action', group: 'TEST' }]) {
      const res = responseCapture();
      await handler({ method: 'GET', query, headers: {} }, res);
      assert.equal(res.statusCode, 400);
      assert.deepEqual(res.body, { success: false, error: 'Aksi tidak valid.' });
      assert.equal('groups' in res.body, false);
      assert.equal('members' in res.body, false);
      assert.equal('results' in res.body, false);
    }
  });
}));
"""
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate final access policy
        run: |
          npm run build
          git diff --check
          node --check api/sector-hot.js
          node --test test/subscription-phase6a-access.test.js
          node --test test/subscription-phase6a-ui.test.js test/subscription-phase6a-runtime.test.js test/subscription-auth.test.js test/subscription-phase5c.test.js test/ui-redesign-a11y.test.js test/subscription-phase2.test.js test/subscription-phase5a.test.js test/production-loader-hotfix.test.js
          test "$(find api -maxdepth 1 -type f -name '*.js' | wc -l | tr -d ' ')" = "12"
      - name: Commit finalizer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/phase6a4-finalize-trigger*
          git add api/sector-hot.js test/subscription-phase6a-access.test.js
          git commit -m 'fix: reject unknown premium data actions'
          git push origin HEAD:codex/implement-subscription-plans-ui
