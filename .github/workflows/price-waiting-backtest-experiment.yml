name: Price Waiting Backtest Experiment

on:
  pull_request:
    branches:
      - feat/daytrade-screener-v1
    paths:
      - 'lib/price-waiting-backtest.js'
      - 'test/price-waiting-backtest.test.js'
      - 'tools/run-price-waiting-backtest.js'
      - 'tools/generate-backtest-report.js'
      - '.github/workflows/price-waiting-backtest-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout experiment
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Unit regression
        run: node --test test/price-waiting-backtest.test.js

      - name: Historical parameter sweep
        run: node tools/run-price-waiting-backtest.js

      - name: Publish validation artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: price-waiting-backtest-report
          path: data/reports/price-waiting-backtest-latest.json
          if-no-files-found: warn
          retention-days: 7
