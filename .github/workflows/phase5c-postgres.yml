name: Phase 5C PostgreSQL harness
on:
  pull_request:
    paths:
      - 'supabase/subscription-phase-2-migration.sql'
      - 'supabase/subscription-phase-5c-voucher-admin-migration.sql'
      - 'test/sql/phase5c/**'
      - '.github/workflows/phase5c-postgres.yml'
jobs:
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: phase5c_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d phase5c_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: phase5c_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL version
        run: psql --version && psql -c 'SELECT version();'
      - name: Apply bootstrap
        run: echo 'Applying test/sql/phase5c/bootstrap.sql' && psql -v ON_ERROR_STOP=1 -f test/sql/phase5c/bootstrap.sql
      - name: Apply Phase 2 migration
        run: echo 'Applying supabase/subscription-phase-2-migration.sql' && psql -v ON_ERROR_STOP=1 -f supabase/subscription-phase-2-migration.sql
      - name: Apply Phase 5C migration
        run: echo 'Applying supabase/subscription-phase-5c-voucher-admin-migration.sql' && psql -v ON_ERROR_STOP=1 -f supabase/subscription-phase-5c-voucher-admin-migration.sql
      - name: Schema smoke
        run: echo 'Applying test/sql/phase5c/schema-smoke.sql' && psql -v ON_ERROR_STOP=1 -f test/sql/phase5c/schema-smoke.sql
