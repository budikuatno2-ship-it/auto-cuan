name: Temporary Premium Workstation V2

on:
  push:
    branches:
      - redesign/premium-workstation-v1

permissions:
  contents: write

jobs:
  redesign-v2:
    if: ${{ !contains(github.event.head_commit.message || '', '[premium-v2-worker]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: redesign/premium-workstation-v1
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply phase 2 fragment
        shell: bash
        run: |
          if ! grep -q 'AUTO-CUAN PREMIUM WORKSTATION V2' public/premium-workstation.css; then
            printf '\n\n' >> public/premium-workstation.css
            cat public/premium-workstation-v2-fragment.css >> public/premium-workstation.css
          fi
          python3 - <<'PY'
          from pathlib import Path
          html = Path('public/index.html')
          s = html.read_text().replace('/premium-workstation.css?v=20260818-v1', '/premium-workstation.css?v=20260818-v2')
          html.write_text(s)

          test = Path('test/premium-workstation-ui.test.js')
          t = test.read_text().replace('premium-workstation.css?v=20260818-v1', 'premium-workstation.css?v=20260818-v2')
          marker = "premium workstation v2 adds structural hierarchy without behavior"
          if marker not in t:
            t += """\n\ntest('premium workstation v2 adds structural hierarchy without behavior', () => {\n  const css = read('public/premium-workstation.css');\n  assert.match(css, /AUTO-CUAN PREMIUM WORKSTATION V2/);\n  assert.match(css, /#page-dashboard \\.market-band-grid[\\s\\S]*grid-template-columns/);\n  assert.match(css, /#dashboardTop5List/);\n  assert.match(css, /#screenerContent \\.scr-filter-grid/);\n  assert.match(css, /#analisisInput/);\n  assert.match(css, /#authChoiceModal/);\n  assert.doesNotMatch(css, /onclick\\s*=|addEventListener|setInterval|setTimeout/);\n});\n"""
          test.write_text(t)
          PY
          rm -f public/premium-workstation-v2-fragment.css .tmp-premium-v2-trigger
      - name: Focused premium UI tests
        run: node --test test/premium-workstation-ui.test.js test/repo-security-hardening.test.js
      - name: Production build gate
        run: npm run build
      - name: Diff whitespace check
        run: git diff --check
      - name: Commit validated phase 2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/premium-workstation.css public/premium-workstation-v2-fragment.css public/index.html test/premium-workstation-ui.test.js .tmp-premium-v2-trigger
          if git diff --cached --quiet; then
            echo "No phase 2 changes to commit"
            exit 0
          fi
          git commit -m "feat: deepen premium workstation hierarchy [premium-v2-worker]"
          git push origin HEAD:redesign/premium-workstation-v1
