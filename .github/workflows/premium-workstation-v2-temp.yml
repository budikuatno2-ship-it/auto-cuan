name: Temporary Premium Workstation V2

on:
  push:
    branches:
      - redesign/premium-workstation-v1

permissions:
  contents: write

jobs:
  redesign-v2:
    if: ${{ !contains(github.event.head_commit.message || '', '[premium-v2-worker]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: redesign/premium-workstation-v1
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply premium workstation phase 2
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          css_path = Path('public/premium-workstation.css')
          html_path = Path('public/index.html')
          test_path = Path('test/premium-workstation-ui.test.js')

          css = css_path.read_text()
          marker = 'AUTO-CUAN PREMIUM WORKSTATION V2 — STRUCTURAL POLISH'
          if marker not in css:
              css += r'''

/* ==========================================================================
   AUTO-CUAN PREMIUM WORKSTATION V2 — STRUCTURAL POLISH
   The first pass established the palette. This pass changes hierarchy:
   fewer floating islands, more continuous data bands, denser command areas,
   stronger table rhythm, and more intentional desktop/mobile composition.
   ========================================================================== */

:root {
  --pw-v2-canvas: #06090e;
  --pw-v2-rail: #080d14;
  --pw-v2-panel: #0a1119;
  --pw-v2-panel-raised: #0d151f;
  --pw-v2-panel-deep: #070c12;
  --pw-v2-line: rgba(148,163,184,.095);
  --pw-v2-line-strong: rgba(148,163,184,.17);
  --pw-v2-glow: rgba(45,212,163,.08);
  --pw-v2-max: 1280px;
}

body {
  background:
    radial-gradient(900px 360px at 50% -160px, rgba(45,212,163,.045), transparent 72%),
    var(--pw-v2-canvas);
}

/* ---------- Header: one deliberate command bar ------------------------- */
.header-shell {
  max-width: 1480px;
  padding-top: 8px !important;
  padding-bottom: 8px !important;
}

.app-header {
  border-bottom-color: rgba(148,163,184,.085);
  background: rgba(6,9,14,.94);
}

.brand-mark {
  width: 34px !important;
  height: 34px !important;
  border-radius: 8px !important;
  background: #0c2a21 !important;
  border: 1px solid rgba(45,212,163,.24);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.035) !important;
}

.brand-mark svg { color: #70e7c3 !important; }
.app-header h1 { font-size: 15px !important; font-weight: 760 !important; letter-spacing: -.02em; }
.app-header h1 + p { font-size: 10px !important; letter-spacing: .015em; color: #667588 !important; }

@media (min-width: 1024px) {
  .desktop-nav {
    display: flex;
    flex: 0 1 auto;
    max-width: min(760px, 58vw);
    margin-inline: auto;
    padding: 3px;
    gap: 2px !important;
    border: 1px solid rgba(148,163,184,.08);
    border-radius: 10px;
    background: #080d14;
  }

  .desktop-nav .nav-btn {
    min-height: 34px;
    padding: 6px 9px;
    border-radius: 7px;
    font-size: 11px;
  }

  .desktop-nav .nav-btn svg {
    width: 14px;
    height: 14px;
    opacity: .82;
  }

  .desktop-nav .nav-btn.active {
    background: rgba(45,212,163,.075);
    border-color: rgba(45,212,163,.16);
    box-shadow: none;
  }

  .desktop-nav .nav-btn.active::before { display: none; }
}

/* ---------- Page frame -------------------------------------------------- */
#page-dashboard,
#page-screener,
#page-sektor,
#page-analisis,
#page-subscription {
  max-width: var(--pw-v2-max) !important;
}

#page-dashboard {
  padding-top: 18px !important;
}

#page-dashboard > .space-y-4 {
  display: flex;
  flex-direction: column;
  gap: 0 !important;
}

/* ---------- Dashboard hero: quieter, more authoritative ---------------- */
#page-dashboard .dashboard-hero {
  min-height: 142px;
  padding: 22px 24px !important;
  margin-bottom: 0;
  border-color: rgba(45,212,163,.135);
  background:
    linear-gradient(90deg, rgba(45,212,163,.035), transparent 36%),
    #091018;
}

#page-dashboard .dashboard-hero::after {
  content: '';
  position: absolute;
  left: 24px;
  right: 24px;
  bottom: 0;
  height: 1px;
  background: linear-gradient(90deg, rgba(45,212,163,.22), rgba(148,163,184,.05) 48%, transparent 90%);
}

#dashGreeting {
  max-width: 760px;
  font-size: clamp(25px, 3vw, 34px) !important;
  line-height: 1.04 !important;
  font-weight: 760 !important;
  letter-spacing: -.04em !important;
}

#dashGreeting + p {
  max-width: 780px !important;
  margin-top: 8px !important;
  color: #8695a7 !important;
  line-height: 1.65;
}

#page-dashboard .dashboard-hero .dash-badge {
  background: rgba(7,12,18,.64);
  border-color: rgba(148,163,184,.105);
  backdrop-filter: blur(6px);
}

#approvedBadge {
  border-radius: 6px !important;
  background: rgba(45,212,163,.075) !important;
  border-color: rgba(45,212,163,.20) !important;
  color: #83ecd0 !important;
  font-size: 10px !important;
  letter-spacing: .04em;
  text-transform: uppercase;
}

/* ---------- Dashboard section language --------------------------------- */
#page-dashboard .ac-section {
  margin-top: 22px;
}

#page-dashboard .ac-section-head {
  min-height: 31px;
  margin-bottom: 9px;
  padding: 0 2px 8px;
  align-items: center;
}

#page-dashboard .ac-section-title {
  color: #8695a8;
  font-size: 10px;
  letter-spacing: .16em;
}

#page-dashboard .ac-section-hint {
  color: #596779;
  font-size: 10.5px;
}

/* ---------- Market state: one continuous market strip ------------------ */
#page-dashboard .market-band-grid {
  display: grid;
  grid-template-columns: minmax(0,1.15fr) repeat(2,minmax(0,1fr));
  gap: 0 !important;
  overflow: hidden;
  border: 1px solid var(--pw-v2-line);
  border-radius: 12px;
  background: var(--pw-v2-panel-deep);
}

#page-dashboard .market-tile {
  min-height: 126px;
  padding: 15px 17px;
  border: 0 !important;
  border-right: 1px solid var(--pw-v2-line) !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

#page-dashboard .market-tile:last-child { border-right: 0 !important; }
#page-dashboard .market-tile:hover { background: rgba(148,163,184,.025) !important; }

#page-dashboard .market-tile-head {
  min-height: 22px;
  margin-bottom: 10px;
}

#page-dashboard .market-tile-label {
  color: #718094;
  font-size: 10px;
  font-weight: 750;
  letter-spacing: .08em;
  text-transform: uppercase;
}

#page-dashboard .market-tile-value {
  color: #eef4f8;
  font-size: 24px;
  font-weight: 760;
  letter-spacing: -.035em;
  font-variant-numeric: tabular-nums;
}

#page-dashboard .market-tile-value.is-text {
  font-size: 16px;
  letter-spacing: -.015em;
}

#page-dashboard .market-tile-unit,
#page-dashboard .market-tile-note {
  color: #667588;
  font-size: 10.5px;
}

#page-dashboard .market-tile-link {
  margin-top: auto;
  color: #6edfc1;
  font-size: 10.5px;
  font-weight: 650;
}

#page-dashboard .dash-section-note {
  margin-top: 8px !important;
  padding: 8px 11px;
  border: 1px solid rgba(247,198,91,.10);
  background: rgba(247,198,91,.028);
  color: #786f5c;
  font-size: 10.5px;
}

/* ---------- Radar command area ----------------------------------------- */
#page-dashboard .panel {
  background: #091018;
  border-color: rgba(148,163,184,.09);
}

#page-dashboard .lg\:col-span-3.panel,
#page-dashboard .lg\:col-span-2.panel {
  min-height: 280px;
}

#page-dashboard .panel-header {
  margin-bottom: 11px;
  padding-bottom: 9px;
}

#page-dashboard .panel-title {
  font-size: 12px;
  letter-spacing: .01em;
  text-transform: uppercase;
  color: #9cabbc;
}

#page-dashboard .panel-subtitle {
  color: #5e6c7f;
}

#dashboardTop5List,
#dashboardMonitorList {
  min-height: 188px;
}

#dashboardTop5List .dashboard-pick-card,
#dashboardMonitorList > *:not(.empty-state),
#top5HistoryList > *:not(.empty-state) {
  border-radius: 8px !important;
  border-color: rgba(148,163,184,.085) !important;
  background: #0b131c !important;
  box-shadow: none !important;
}

#dashboardTop5List .dashboard-pick-card:hover,
#top5HistoryList > *:not(.empty-state):hover {
  border-color: rgba(45,212,163,.20) !important;
  background: #0d1721 !important;
}

#dashboardMonitorUpdated {
  padding: 3px 6px;
  border-radius: 5px;
  background: #070d13;
  border: 1px solid rgba(148,163,184,.075);
}

/* ---------- History: calmer segmented tabs ----------------------------- */
#top5HistoryTabActive,
#top5HistoryTabTp {
  min-height: 31px;
  padding: 5px 10px !important;
  border-radius: 6px !important;
  background: #070d13 !important;
  border-color: rgba(148,163,184,.09) !important;
  color: #758497 !important;
  font-weight: 680;
}

#top5HistoryTabActive {
  background: rgba(45,212,163,.07) !important;
  border-color: rgba(45,212,163,.19) !important;
  color: #79e5c7 !important;
}

#top5HistoryList {
  border-top: 1px solid rgba(148,163,184,.055);
  padding-top: 8px;
}

/* ---------- Analysis: command input + market context ------------------- */
#page-analisis > div:first-child {
  padding: 12px 0 !important;
  border-bottom-color: rgba(148,163,184,.08) !important;
  background: linear-gradient(180deg, rgba(6,9,14,.985), rgba(6,9,14,.94));
}

#analisisInput {
  height: 44px;
  padding-left: 15px !important;
  border-radius: 9px !important;
  background: #070d13 !important;
  border-color: rgba(148,163,184,.12) !important;
  font-variant-numeric: tabular-nums;
}

#analisisInput::placeholder { color: #536174 !important; }

#page-analisis > div:first-child button {
  min-height: 44px;
  border-radius: 9px !important;
}

#rankingTableWrap {
  overflow: auto;
  border-radius: 8px;
  background: #070d13;
}

#analisisResult {
  padding-top: 14px !important;
}

#analisisFollowUp {
  border-top-color: rgba(148,163,184,.085) !important;
  background: rgba(6,9,14,.96);
}

#analysisChatInput {
  min-height: 44px;
  border-radius: 10px !important;
  background: #080e15 !important;
}

#analysisSendBtn {
  width: 44px;
  height: 44px;
  padding: 0 !important;
  border-radius: 9px !important;
}

/* ---------- Screener: treat controls as a dock, results as the product -- */
#screenerContent {
  gap: 12px !important;
}

#screenerContent > .ac-segmented {
  margin-bottom: 2px !important;
  border-color: rgba(148,163,184,.095);
  background: #070d13;
}

#screenerContent .scr-filter-grid {
  padding: 8px !important;
  gap: 6px !important;
  border-radius: 9px !important;
  border-color: rgba(148,163,184,.085) !important;
  background: #080e15 !important;
}

#screenerContent .scr-filter-grid select,
#screenerContent .scr-filter-grid input[type="text"],
#screenerContent .scr-filter-grid input:not([type]) {
  min-height: 34px;
  border-radius: 7px !important;
  font-size: 10.5px !important;
}

#screenerContent .scr-filter-grid label {
  min-height: 34px;
  border-radius: 7px !important;
  border-color: rgba(148,163,184,.10) !important;
  background: #070c12 !important;
}

.kg-screener-tab,
.nk-screener-tab,
.dt-screener-tab,
.screener-tab {
  min-height: 31px;
  padding: 5px 9px !important;
  border-radius: 6px !important;
  border: 1px solid transparent;
  background: transparent;
  color: #718094;
  font-size: 10.5px !important;
  font-weight: 680 !important;
}

.kg-screener-tab:hover,
.nk-screener-tab:hover,
.dt-screener-tab:hover,
.screener-tab:hover {
  background: rgba(148,163,184,.045);
  color: #b6c2cf;
}

.kg-screener-tab.active,
.nk-screener-tab.active,
.dt-screener-tab.active,
.screener-tab.active {
  background: rgba(45,212,163,.07) !important;
  border-color: rgba(45,212,163,.17) !important;
  color: #79e7c8 !important;
}

#dtCardGrid,
#kgCardGrid,
#nkCardGrid {
  gap: 8px !important;
}

.dt-card-item,
.kg-card-item,
.nk-card-item {
  position: relative;
  overflow: hidden;
  border-radius: 9px !important;
  background: #091119 !important;
}

.dt-card-item::before,
.kg-card-item::before,
.nk-card-item::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 2px;
  background: rgba(148,163,184,.11);
}

.dt-card-item:hover::before,
.kg-card-item:hover::before,
.nk-card-item:hover::before {
  background: rgba(45,212,163,.52);
}

#dtProgressWrap > div {
  border-radius: 9px !important;
  border-color: rgba(103,169,255,.12) !important;
  background: #080f17 !important;
  box-shadow: none !important;
}

#dtProgressBar {
  background: #2dcf9d !important;
  box-shadow: 0 0 14px rgba(45,212,163,.16);
}

/* ---------- Sector cards ----------------------------------------------- */
#sektorGroupsGrid > * {
  border-radius: 9px !important;
  border-color: rgba(148,163,184,.09) !important;
  background: #091119 !important;
  box-shadow: none !important;
}

#sektorGroupsGrid > *:hover {
  border-color: rgba(45,212,163,.20) !important;
  background: #0c151e !important;
}

/* ---------- Subscription: premium without “pricing-template” chrome ---- */
.subscription-hero {
  border-radius: 13px !important;
  border: 1px solid rgba(45,212,163,.12) !important;
  background: linear-gradient(90deg, rgba(45,212,163,.035), transparent 42%), #091018 !important;
  box-shadow: none !important;
}

.subscription-summary {
  border-radius: 9px !important;
  background: #070d13 !important;
  border-color: rgba(148,163,184,.085) !important;
}

#subscriptionPlans > * {
  border-radius: 10px !important;
  box-shadow: none !important;
}

/* ---------- Landing: editorial rather than card catalogue -------------- */
.landing-hero {
  position: relative;
  overflow: hidden;
  padding-top: 104px;
  padding-bottom: 104px;
}

.landing-hero::before {
  content: '';
  position: absolute;
  width: 740px;
  height: 360px;
  left: 50%;
  top: -230px;
  transform: translateX(-50%);
  border-radius: 50%;
  background: rgba(45,212,163,.055);
  filter: blur(90px);
  pointer-events: none;
}

.landing-hero > * { position: relative; z-index: 1; }

.landing-hero h1 {
  max-width: 760px;
  font-size: clamp(46px, 5.4vw, 72px) !important;
  line-height: .99 !important;
  letter-spacing: -.055em !important;
}

.landing-hero h1 + p {
  max-width: 680px !important;
  font-size: 16px !important;
  line-height: 1.75 !important;
  color: #8d9aab !important;
}

.landing-card {
  border-color: rgba(148,163,184,.10);
  background: #080f16;
  box-shadow: 0 24px 58px rgba(0,0,0,.25);
}

.landing-card .mock-card {
  background: #0b131c;
  border-color: rgba(148,163,184,.075);
}

.landing-section {
  border-top-color: rgba(148,163,184,.045);
}

.landing-section:nth-of-type(even) {
  background: rgba(8,13,20,.44) !important;
}

.landing-section .feature-card {
  position: relative;
  border-radius: 9px;
  background: transparent;
  border-color: rgba(148,163,184,.075);
  box-shadow: none;
}

.landing-section .feature-card:hover {
  background: rgba(148,163,184,.025);
  border-color: rgba(45,212,163,.16);
}

.landing-section .step-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  height: 24px;
  padding: 0 8px;
  border-radius: 5px;
  background: rgba(45,212,163,.065);
  border: 1px solid rgba(45,212,163,.12);
  color: #79dfc3;
  font-size: 10px;
  font-weight: 800;
}

.landing-section h2 {
  max-width: 760px;
  line-height: 1.08;
}

.landing-section p { line-height: 1.72; }

/* ---------- Modal / auth ------------------------------------------------ */
#authChoiceModal {
  background: rgba(1,4,8,.76) !important;
  backdrop-filter: blur(8px) !important;
}

#authChoiceModal > div {
  max-width: 460px !important;
  border-radius: 13px !important;
  border-color: rgba(148,163,184,.13) !important;
  background: #091018 !important;
  box-shadow: 0 32px 80px rgba(0,0,0,.54) !important;
}

#authChoiceModal .landing-auth-card {
  border-radius: 9px;
  background: #070d13;
  min-height: 104px;
}

/* ---------- Empty/loading states --------------------------------------- */
.empty-state {
  min-height: 132px;
  border: 1px dashed rgba(148,163,184,.10);
  border-radius: 8px;
  background: rgba(7,12,18,.44);
}

.empty-state-icon {
  color: #465467 !important;
  opacity: .82;
}

.empty-state-text {
  color: #657487 !important;
}

/* ---------- Mobile: make the app feel native and intentional ----------- */
@media (max-width: 767px) {
  body {
    background: var(--pw-v2-canvas);
  }

  .header-shell {
    padding-left: 10px !important;
    padding-right: 10px !important;
  }

  .app-header h1 { font-size: 14px !important; }
  .brand-mark { width: 32px !important; height: 32px !important; }

  #page-dashboard,
  #page-screener,
  #page-sektor,
  #page-analisis,
  #page-subscription {
    padding-left: 10px !important;
    padding-right: 10px !important;
  }

  #page-dashboard .dashboard-hero {
    min-height: 0;
    padding: 17px 15px !important;
    border-radius: 10px;
  }

  #dashGreeting {
    font-size: 26px !important;
  }

  #page-dashboard .market-band-grid {
    grid-template-columns: 1fr;
    border-radius: 10px;
  }

  #page-dashboard .market-tile {
    min-height: 96px;
    padding: 13px 14px;
    border-right: 0 !important;
    border-bottom: 1px solid var(--pw-v2-line) !important;
  }

  #page-dashboard .market-tile:last-child { border-bottom: 0 !important; }
  #page-dashboard .market-tile-value { font-size: 21px; }

  #page-dashboard .ac-section {
    margin-top: 18px;
  }

  #page-dashboard .ac-section-head {
    align-items: flex-start;
    gap: 4px;
  }

  #page-dashboard .ac-section-hint {
    max-width: 150px;
    text-align: right;
    line-height: 1.35;
  }

  #page-dashboard .panel {
    border-radius: 9px;
  }

  #dashboardTop5List,
  #dashboardMonitorList {
    min-height: 150px;
  }

  #page-analisis > div:first-child {
    padding-top: 8px !important;
    padding-bottom: 8px !important;
  }

  #analisisInput {
    min-width: 0;
  }

  #screenerContent .scr-filter-grid {
    padding: 7px !important;
  }

  #dtCardGrid,
  #kgCardGrid,
  #nkCardGrid {
    grid-template-columns: 1fr !important;
  }

  .dt-card-item,
  .kg-card-item,
  .nk-card-item {
    border-radius: 8px !important;
  }

  .landing-hero {
    padding-top: 58px;
    padding-bottom: 58px;
  }

  .landing-hero h1 {
    font-size: clamp(38px, 11.5vw, 52px) !important;
    letter-spacing: -.052em !important;
  }

  .landing-hero h1 + p {
    font-size: 14px !important;
    line-height: 1.68 !important;
  }

  .landing-section {
    padding-top: 48px;
    padding-bottom: 48px;
  }

  .landing-section .feature-card {
    padding: 14px;
  }

  #authChoiceModal {
    padding: 10px !important;
  }

  #authChoiceModal > div {
    border-radius: 11px !important;
    padding: 18px !important;
  }
}

@media (min-width: 1280px) {
  #page-dashboard .grid.lg\:grid-cols-5 {
    gap: 10px !important;
  }

  #page-dashboard .lg\:col-span-3.panel {
    grid-column: span 3 / span 3;
  }

  #page-dashboard .lg\:col-span-2.panel {
    grid-column: span 2 / span 2;
  }
}

@media (prefers-reduced-motion: reduce) {
  .landing-hero::before { display: none; }
}
'''
              css_path.write_text(css)

          html = html_path.read_text()
          html = html.replace('/premium-workstation.css?v=20260818-v1', '/premium-workstation.css?v=20260818-v2')
          html_path.write_text(html)

          test = test_path.read_text()
          test = test.replace('premium-workstation.css?v=20260818-v1', 'premium-workstation.css?v=20260818-v2')
          if 'premium workstation v2 adds structural hierarchy without behavior' not in test:
              test += r'''

test('premium workstation v2 adds structural hierarchy without behavior', () => {
  const css = read('public/premium-workstation.css');
  assert.match(css, /AUTO-CUAN PREMIUM WORKSTATION V2 — STRUCTURAL POLISH/);
  assert.match(css, /#page-dashboard \.market-band-grid[\s\S]*grid-template-columns/);
  assert.match(css, /#dashboardTop5List/);
  assert.match(css, /#screenerContent \.scr-filter-grid/);
  assert.match(css, /#analisisInput/);
  assert.match(css, /#authChoiceModal/);
  assert.doesNotMatch(css, /onclick\s*=|addEventListener|setInterval|setTimeout/);
});
'''
              test_path.write_text(test)
          PY
      - name: Focused premium UI tests
        run: node --test test/premium-workstation-ui.test.js test/repo-security-hardening.test.js
      - name: Production build gate
        run: npm run build
      - name: Diff whitespace check
        run: git diff --check
      - name: Commit validated phase 2
