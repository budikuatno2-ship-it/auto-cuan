name: Compare WebKit keyboard cascade
on:
  push:
    branches: [fix/precision-workspace-finance]
    paths: [.github/workflows/mobile-performance-apply.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python -m pip install PyYAML==6.0.2 -r tools/precision-test-requirements.txt
      - name: Reuse the immutable checksum-verifying source reconstruction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python <<'PY'
          import base64,json,os,subprocess,urllib.request,yaml
          url='https://api.github.com/repos/budikuatno2-ship-it/auto-cuan/contents/.github/workflows/mobile-performance-apply.yml?ref=a4f4c91c42ef59e7a6a97d520186252ad7cca940'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as res: source=base64.b64decode(json.load(res)['content']).decode()
          workflow=yaml.safe_load(source)
          step=next(s for s in workflow['jobs']['apply']['steps'] if s.get('name')=='Verify baseline and ordered reviewed changes')
          command=step['run'];assert command.startswith('test "$(git rev-parse HEAD^)" = df51df60e155f7e45be57851166fedc5495f1da5\n')
          subprocess.run(['bash','-eu','-c',command.split('\n',1)[1]],check=True)
          PY
      - name: Install WebKit once for isolated experiments
        run: python -m playwright install --with-deps webkit
      - name: Compare equivalent CSS and update ordering using unchanged assertions
        run: |
          python <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          js=Path('public/viewport-runtime.js');css=Path('public/viewport.css');original_js=js.read_text();original_css=css.read_text()
          class_line="    root.classList.toggle('ac-keyboard-open', state.keyboard);\n"
          assert class_line in original_js
          anchor="    css('--ac-keyboard-gap', state.keyboardGap);"
          assert anchor in original_js
          reordered=original_js.replace(class_line,'').replace(anchor,anchor+'\n'+class_line.rstrip())
          def expand(m):return ',\n'.join('html.ac-keyboard-open '+part.strip()+(m.group(2) or '') for part in m.group(1).split(','))
          expanded=re.sub(r'html\.ac-keyboard-open :is\(([^)]+)\)(\s*>\s*div)?',expand,original_css)
          variants=[('baseline',original_js,original_css),('variables-before-class',reordered,original_css),('explicit-selectors',original_js,expanded),('explicit-and-ordered',reordered,expanded)]
          summary=[]
          for name,j,c in variants:
              js.write_text(j);css.write_text(c)
              out=Path('/tmp/keyboard-cascade')/name;out.mkdir(parents=True,exist_ok=True)
              result=subprocess.run(['python','tools/test-mobile-performance.py'],env={**os.environ,'BROWSER_ENGINE':'webkit','PRECISION_TEST_OUTPUT':str(out)},stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=150)
              (out/'test.log').write_text(result.stdout)
              report=out/'mobile-results-webkit.json'
              summary.append({'variant':name,'returncode':result.returncode,'report':json.loads(report.read_text()) if report.exists() else None})
          js.write_text(original_js);css.write_text(original_css)
          Path('/tmp/keyboard-cascade/summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps([{'variant':s['variant'],'returncode':s['returncode'],'passed':(s['report'] or {}).get('passed')} for s in summary]))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: webkit-keyboard-cascade
          path: /tmp/keyboard-cascade
          retention-days: 2
