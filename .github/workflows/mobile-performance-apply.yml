name: Diagnose mobile performance review
on:
  push:
    branches: [fix/precision-workspace-finance]
    paths: [.github/workflows/mobile-performance-apply.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRECISION_TEST_OUTPUT: /tmp/mobile-performance-review
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reconstruct exact source without publishing it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python <<'PY'
          import base64,hashlib,json,os,urllib.request,zlib
          from pathlib import Path
          def fetch(sha):
              request=urllib.request.Request('https://api.github.com/repos/budikuatno2-ship-it/auto-cuan/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response: raw=base64.b64decode(json.load(response)['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              return raw
          shas=['81c7b6bdcb222b47005c39390c7602566fa8a48a','d50837def0e50d31e1921b88863c4bd31676c7eb','b1cd9ca2a787059da55bd123fe06aef2f3c65ff0','3fc12c4fc350a2d2b5d67c9c721563010c4d1b55','c2a9da457f9189c1f6d461b09d5fb37f9104975e','f584f076a5db753c88208228e1aaed564cca43c7','579ec6f9f3543cdc78b27e30f2a9810953132a62']
          data=b''.join(fetch(sha) for sha in shas);assert hashlib.sha256(data).hexdigest()=='8c9de7b4378a0ffca94a36454a0c88da4e705e319b8969c07dbb8d68aa119035'
          items=json.loads(zlib.decompress(data))+json.loads(zlib.decompress(fetch('aef249f3bc0e356f2f85c37a997915c0ae6c6553')))
          assert len(items)==23
          for item in items:
              path=Path(item['path']);assert not path.is_absolute() and '..' not in path.parts and path.parts[0] in {'public','lib','docs','tools','test','supabase','deploy'}
              if item['sha'] is None: assert not path.exists();content=item['content']
              else:
                  old=path.read_text();assert hashlib.sha256(old.encode()).hexdigest()==item['sha'];lines=old.splitlines(True)
                  for start,end,text in reversed(item['edits']):lines[start:end]=text.splitlines(True)
                  content=''.join(lines)
              assert hashlib.sha256(content.encode()).hexdigest()==item['after'];path.parent.mkdir(parents=True,exist_ok=True);path.write_text(content)
          Path('/tmp/mobile-performance-review').mkdir(exist_ok=True)
          PY
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install -r tools/precision-test-requirements.txt
      - name: Start isolated preview
        run: |
          echo "CHROMIUM_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
          PORT=3100 node tools/local-dev-server.js > /tmp/mobile-performance-review/preview.log 2>&1 &
          sleep 2
      - name: Repeat first real-app visibility assertion with passive trace
        run: |
          python <<'PY'
          import os,json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          env={'__file__':str(Path('tools/test-precision-app.py').resolve())}
          exec(compile(Path('tools/test-precision-app.py').read_text().split('with sync_playwright() as pw:')[0],'full-app-fixture','exec'),env)
          with sync_playwright() as pw:
              browser=pw.chromium.launch(executable_path=os.environ['CHROMIUM_PATH'],headless=True,args=['--no-sandbox'])
              for attempt in range(3):
                  page=browser.new_page(viewport={'width':1440,'height':1000},reduced_motion='reduce');page.route('**/*',env['network']);logs=[]
                  page.on('console',lambda msg:logs.append({'type':msg.type,'text':msg.text}));page.on('pageerror',lambda err:logs.append({'error':str(err)}))
                  page.add_init_script("window.__visibilityTrace=[];new MutationObserver(records=>{for(const r of records){const e=r.target;if(['page-money-management','appMain','appShell','initialLoader','dashboardScreen'].includes(e.id))__visibilityTrace.push({time:performance.now(),id:e.id,class:e.className,style:e.getAttribute('style'),hidden:e.hidden});}}).observe(document,{subtree:true,attributes:true,attributeFilter:['class','style','hidden']});")
                  page.goto('http://127.0.0.1:3100/preview/kelola-keuangan',wait_until='domcontentloaded')
                  result='visible'
                  try: page.wait_for_selector('#mmCashflowSpreadsheetBody tr',timeout=30000)
                  except Exception as error: result=str(error)
                  page.wait_for_timeout(6000)
                  state=page.evaluate("()=>{let nodes=[];for(let n=document.querySelector('#mmCashflowSpreadsheetBody tr');n;n=n.parentElement){const s=getComputedStyle(n);nodes.push({tag:n.tagName,id:n.id,class:n.className,hidden:n.hidden,style:n.getAttribute('style'),display:s.display,visibility:s.visibility,opacity:s.opacity,contentVisibility:s.contentVisibility,width:n.offsetWidth,height:n.offsetHeight});}return {nodes,trace:__visibilityTrace,current:typeof currentPage!=='undefined'?currentPage:null};}")
                  Path('/tmp/mobile-performance-review/app-'+str(attempt)+'.json').write_text(json.dumps({'result':result,'state':state,'console':logs},indent=2));page.screenshot(path='/tmp/mobile-performance-review/app-'+str(attempt)+'.png');page.close()
              browser.close()
          PY
      - name: Add failure-only geometry capture to the test fixture
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('tools/test-mobile-performance.py');s=p.read_text();needle='    finally:\n';assert s.count(needle)==1
          extra="    finally:\n        diagnostic=page.evaluate(\"()=>{const e=document.querySelector('#registerModal');const s=e&&getComputedStyle(e);return {viewport:window.AutoCuanViewport&&AutoCuanViewport.snapshot(),inner:[innerWidth,innerHeight],client:[document.documentElement.clientWidth,document.documentElement.clientHeight],rootClass:document.documentElement.className,rootStyle:document.documentElement.getAttribute('style'),active:document.activeElement&&document.activeElement.id,dialog:e&&{bounds:e.getBoundingClientRect().toJSON(),child:e.firstElementChild.getBoundingClientRect().toJSON(),position:s.position,top:s.top,height:s.height,padding:s.padding,transform:s.transform},cssCount:document.styleSheets.length}}\")\n        (OUT/f'geometry-{ENGINE}.json').write_text(json.dumps(diagnostic,indent=2))\n        page.screenshot(path=str(OUT/f'geometry-{ENGINE}.png'))\n"
          p.write_text(s.replace(needle,extra))
          PY
      - name: Chromium keyboard regression
        run: python tools/test-mobile-performance.py
      - name: Install WebKit
        run: python -m playwright install --with-deps webkit
      - name: WebKit keyboard regression
        run: BROWSER_ENGINE=webkit python tools/test-mobile-performance.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mobile-performance-diagnostics
          path: /tmp/mobile-performance-review
          retention-days: 7
