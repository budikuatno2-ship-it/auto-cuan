name: Validate mobile performance and keyboard publication
on:
  push:
    branches: [fix/precision-workspace-finance]
    paths: [.github/workflows/mobile-performance-apply.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/precision-workspace-finance'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    env:
      PRECISION_TEST_OUTPUT: /tmp/mobile-performance-review
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install PyYAML==6.0.2 -r tools/precision-test-requirements.txt
      - name: Reconstruct checksum-verified source and deterministic test synchronization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD^)" = ce2591817fc04bd8cf6a9dbfff1e71936de49944
          python <<'PY'
          import base64,hashlib,json,os,subprocess,urllib.request,yaml,zlib
          from pathlib import Path
          def request(url):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as res:return json.load(res)
          item=request('https://api.github.com/repos/budikuatno2-ship-it/auto-cuan/contents/.github/workflows/mobile-performance-apply.yml?ref=a4f4c91c42ef59e7a6a97d520186252ad7cca940')
          source=base64.b64decode(item['content']).decode()
          step=next(s for s in yaml.safe_load(source)['jobs']['apply']['steps'] if s.get('name')=='Verify baseline and ordered reviewed changes')
          command=step['run'];assert command.startswith('test "$(git rev-parse HEAD^)" = df51df60e155f7e45be57851166fedc5495f1da5\n')
          subprocess.run(['bash','-eu','-c',command.split('\n',1)[1]],check=True)
          blob=request('https://api.github.com/repos/budikuatno2-ship-it/auto-cuan/git/blobs/1db43df1950db2ece2d36e2b8e6fba4c4c2b383c')
          raw=base64.b64decode(blob['content']);assert hashlib.sha256(raw).hexdigest()=='7fafa4ae63c6175be120c509f3c9dd2ac3472946751216386835d1d420477820'
          items=json.loads(zlib.decompress(raw));assert len(items)==1 and items[0]['path']=='tools/test-mobile-performance.py'
          manifest=Path('/tmp/mobile-reviewed-manifest.json');files=json.loads(manifest.read_text())
          for item in items:
              p=Path(item['path']);old=p.read_text();assert hashlib.sha256(old.encode()).hexdigest()==item['sha'];lines=old.splitlines(True)
              for start,end,text in reversed(item['edits']):lines[start:end]=text.splitlines(True)
              content=''.join(lines);assert hashlib.sha256(content.encode()).hexdigest()==item['after'];p.write_text(content);files[str(p)]=item['after']
          manifest.write_text(json.dumps(files))
          print('24 source files verified. Bounds/IME assertions unchanged; synthetic viewport waits for published geometry and rendered frames.')
          PY
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax, scoped styles and focused contracts
        run: |
          node tools/validate-full-syntax.js && node tools/check-precision-inline.js && node tools/build-portfolio-spa-css.js --check
          node --test test/money-sheet.test.js test/portfolio-command-center.test.js test/portfolio-planner-v1.test.js test/portfolio-missing-is-not-zero.test.js test/portfolio-price-freshness.test.js test/portfolio-render-not-gated-by-network.test.js test/tab-navigation-and-insider-universe.test.js test/ui-theme-layer.test.js test/holver-app-shell-theme.test.js test/standalone-analisis-saham.test.js test/financial-surface-contract.test.js test/spreadsheet-grade-ui.test.js test/precision-motion-cascade.test.js test/landing-experience.test.js test/money-sheet-formulas.test.js test/workspace-detail.test.js test/static-assets.test.js test/viewport-runtime.test.js test/login-password-toggle.test.js test/workspace-access-visibility.test.js > /tmp/mobile-performance-review/focused.log 2>&1
      - name: Production build
        run: npm run build > /tmp/mobile-performance-review/build.log 2>&1
      - name: Start isolated browser preview
        run: |
          echo "CHROMIUM_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
          PORT=3100 node tools/local-dev-server.js > /tmp/mobile-performance-review/preview.log 2>&1 &
          sleep 2
      - name: Browser regressions with real code and mocked accounts
        run: |
          python tools/test-precision-app.py
          python tools/test-precision-browser.py
          python tools/test-landing-experience.py
          python tools/test-workspace-detail.py
          python tools/test-mobile-performance.py
          node tools/benchmark-static-assets.js
      - name: Install isolated WebKit engine
        run: python -m playwright install --with-deps webkit
      - name: WebKit simulated keyboard regression
        run: BROWSER_ENGINE=webkit python tools/test-mobile-performance.py
      - name: Full registered regression suite without skipped files
        run: npm test > /tmp/mobile-performance-review/full-suite.log 2>&1
      - name: Publish tested source only to review branch
        run: |
          python <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          files=json.loads(Path('/tmp/mobile-reviewed-manifest.json').read_text())
          for name,digest in files.items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*files],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ui): coordinate keyboards, recover approved views and optimize VPS asset delivery'
          git push origin HEAD:refs/heads/fix/precision-workspace-finance
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mobile-performance-validation
          path: /tmp/mobile-performance-review
          retention-days: 7
