name: Validate and apply mobile performance review
on:
  push:
    branches: [fix/precision-workspace-finance]
    paths: [.github/workflows/mobile-performance-apply.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/precision-workspace-finance'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    env:
      PRECISION_TEST_OUTPUT: /tmp/mobile-performance-review
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Verify baseline and exact reviewed source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD^)" = 3c69445d35a6f639448a78986e83ab58ab37b284
          python <<'PY'
          import base64,hashlib,json,os,urllib.request,zlib
          from pathlib import Path
          shas=['81c7b6bdcb222b47005c39390c7602566fa8a48a','d50837def0e50d31e1921b88863c4bd31676c7eb','b1cd9ca2a787059da55bd123fe06aef2f3c65ff0','3fc12c4fc350a2d2b5d67c9c721563010c4d1b55','c2a9da457f9189c1f6d461b09d5fb37f9104975e','f584f076a5db753c88208228e1aaed564cca43c7','579ec6f9f3543cdc78b27e30f2a9810953132a62']
          data=b''
          for sha in shas:
              url='https://api.github.com/repos/budikuatno2-ship-it/auto-cuan/git/blobs/'+sha
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response: blob=json.load(response)
              raw=base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              data+=raw
          assert len(data)==21102
          assert hashlib.sha256(data).hexdigest()=='8c9de7b4378a0ffca94a36454a0c88da4e705e319b8969c07dbb8d68aa119035'
          items=json.loads(zlib.decompress(data))
          allowed={'deploy/nginx/autocuan','docs/MOBILE-PERFORMANCE-REVIEW.md','lib/static-assets.js','public/analisis-saham.html','public/assets/fca-stocks.js','public/index.html','public/mobile-ui-runtime-v5.js','public/money-sheet-grid.js','public/money-sheet-runtime.js','public/number-flow-runtime.js','public/portfolio-command-center.html','public/register.html','public/viewport-runtime.js','public/viewport.css','supabase/money-sheet-setup.sql','supabase/money-sheet-v1-migration.sql','test/static-assets.test.js','test/viewport-runtime.test.js','tools/benchmark-static-assets.js','tools/curated-build-tests.json','tools/local-dev-server.js','tools/test-mobile-performance.py'}
          assert len(items)==22 and {i['path'] for i in items}==allowed
          pending=[]
          for item in items:
              path=Path(item['path'])
              if item['sha'] is None:
                  assert not path.exists(),str(path)
                  content=item['content']
              else:
                  old=path.read_text()
                  assert hashlib.sha256(old.encode()).hexdigest()==item['sha'],str(path)
                  lines=old.splitlines(True)
                  for start,end,text in reversed(item['edits']): lines[start:end]=text.splitlines(True)
                  content=''.join(lines)
              assert hashlib.sha256(content.encode()).hexdigest()==item['after'],str(path)
              pending.append((path,content,item['after']))
          for path,content,_ in pending:
              path.parent.mkdir(parents=True,exist_ok=True);path.write_text(content)
          Path('/tmp/mobile-reviewed-manifest.json').write_text(json.dumps({str(path):digest for path,_,digest in pending}))
          Path('/tmp/mobile-performance-review').mkdir(exist_ok=True)
          print('22 source files verified before applying; no production service accessed.')
          PY
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax and existing scoped styles
        run: node tools/validate-full-syntax.js && node tools/check-precision-inline.js && node tools/build-portfolio-spa-css.js --check
      - name: Focused regressions and new viewport/static tests
        run: node --test test/money-sheet.test.js test/portfolio-command-center.test.js test/portfolio-planner-v1.test.js test/portfolio-missing-is-not-zero.test.js test/portfolio-price-freshness.test.js test/portfolio-render-not-gated-by-network.test.js test/tab-navigation-and-insider-universe.test.js test/ui-theme-layer.test.js test/holver-app-shell-theme.test.js test/standalone-analisis-saham.test.js test/financial-surface-contract.test.js test/spreadsheet-grade-ui.test.js test/precision-motion-cascade.test.js test/landing-experience.test.js test/money-sheet-formulas.test.js test/workspace-detail.test.js test/static-assets.test.js test/viewport-runtime.test.js > /tmp/mobile-performance-review/focused.log 2>&1
      - name: Production build
        run: npm run build > /tmp/mobile-performance-review/build.log 2>&1
      - name: Full registered regression suite
        run: npm test > /tmp/mobile-performance-review/full-suite.log 2>&1
      - run: python -m pip install -r tools/precision-test-requirements.txt
      - name: Chromium and loopback preview
        run: |
          echo "CHROMIUM_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
          PORT=3100 node tools/local-dev-server.js > /tmp/mobile-performance-review/preview.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:3100/preview/kelola-keuangan -o /dev/null && break; sleep 1; done
      - name: Existing real-code mocked browser regressions
        run: |
          python tools/test-precision-browser.py
          python tools/test-precision-app.py
          python tools/test-landing-experience.py
          python tools/test-workspace-detail.py
      - name: Simulated Chromium keyboard and static transfers
        run: |
          python tools/test-mobile-performance.py
          node tools/benchmark-static-assets.js
      - name: Install isolated WebKit engine
        run: python -m playwright install --with-deps webkit
      - name: Simulated WebKit keyboard regression
        run: BROWSER_ENGINE=webkit python tools/test-mobile-performance.py
      - name: Commit only verified files to review branch
        run: |
          python <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          files=json.loads(Path('/tmp/mobile-reviewed-manifest.json').read_text())
          for name,digest in files.items(): assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*files],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ui): coordinate mobile keyboards and reduce grid and VPS asset overhead'
          git push origin HEAD:refs/heads/fix/precision-workspace-finance
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mobile-performance-validation
          path: /tmp/mobile-performance-review
          retention-days: 7
