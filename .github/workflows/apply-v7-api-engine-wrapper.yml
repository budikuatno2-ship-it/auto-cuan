name: Apply V7 API Engine Router

on:
  push:
    branches:
      - feat/fast-watcher-volume-pace-v7
    paths:
      - tools/apply-v7-api-engine-wrapper.js
      - .github/workflows/apply-v7-api-engine-wrapper.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/fast-watcher-volume-pace-v7
          fetch-depth: 0

      - name: Apply exact API require patch
        run: node tools/apply-v7-api-engine-wrapper.js

      - name: Validate changed source
        run: |
          node --check api/sector-hot.js
          node --check lib/daytrade-screener-engine-v7.js
          node --check lib/intraday-volume-pace.js

      - name: Commit patched API source
        run: |
          if git diff --quiet -- api/sector-hot.js; then
            echo "V7_API_ENGINE_ROUTER_COMMIT=NOT_NEEDED"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/sector-hot.js
          git commit -m "feat: route Day Trade full scan through volume pace V7"
          git push origin HEAD:feat/fast-watcher-volume-pace-v7
