name: Deliver exact Claude production audit

on:
  pull_request:
    branches:
      - audit-trigger-base
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: deliver-exact-claude-audit
  cancel-in-progress: false

jobs:
  deliver:
    if: github.head_ref == 'agent/apply-claude-audit-3002941'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact production base
        uses: actions/checkout@v4
        with:
          ref: feat/daytrade-screener-v1
          fetch-depth: 0

      - name: Assert production branch has not moved
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'ac67e23a702aa265dad8046f02ca6eb98636ecd4'

      - name: Download and decrypt audited patch
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 \
            'https://transfer.sh/autocuan-production-audit-3002941-7f4c8a2d.enc' \
            --output /tmp/audit.patch.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in /tmp/audit.patch.enc \
            -out /tmp/audit.patch \
            -pass pass:'autocuan-audit-3002941-7f4c8a2d-20260727'
          echo '6666b48f835dadb971440d9f9e0d9bc81f69a2eb462a06bdb25e146417104e5a  /tmp/audit.patch' | sha256sum -c -

      - name: Apply exact audited patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --index --binary /tmp/audit.patch
          test "$(git write-tree)" = '2526c4d7a532de8c8443090805e9785e021eeafe'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate build twice and API limit
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run build
          test "$(find api -maxdepth 1 -type f -name '*.js' | wc -l | tr -d ' ')" = '12'
          test "$(git write-tree)" = '2526c4d7a532de8c8443090805e9785e021eeafe'

      - name: Run production website regression audit
        run: node --test test/website-production-audit.test.js

      - name: Commit and push audited production tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = '2526c4d7a532de8c8443090805e9785e021eeafe'
          git config user.name 'Auto-Cuan Audit Delivery'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix: consolidate production website audit'
          git push origin HEAD:feat/daytrade-screener-v1
