name: Temporary Frontend Boundary Fix

on:
  push:
    branches:
      - chore/frontend-runtime-decomposition-v1

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout working branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/frontend-runtime-decomposition-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Restore critical inline fallback and narrow cached runtime
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const indexPath = 'public/index.html';
          const cssPath = 'public/index-shell.css';
          const runtimePath = 'public/market-feature-runtime.js';
          const testPath = 'test/frontend-runtime-decomposition.test.js';

          let html = fs.readFileSync(indexPath, 'utf8');
          let css = fs.readFileSync(cssPath, 'utf8');
          let runtime = fs.readFileSync(runtimePath, 'utf8');

          const must = (ok, msg) => { if (!ok) throw new Error(msg); };

          // 1) Keep the .hidden safety net in HTML, before Tailwind, so Tailwind's
          // responsive display utilities can override it when available while the
          // fallback still works if external stylesheets fail.
          const hiddenStart = css.indexOf('/* ---- .hidden safety net');
          const hiddenEnd = css.indexOf('/* Hide any previously saved broken Level Fokus', hiddenStart);
          must(hiddenStart >= 0 && hiddenEnd > hiddenStart, 'external .hidden safety block not found');
          css = css.slice(0, hiddenStart) + css.slice(hiddenEnd);

          const maintenanceStart = css.indexOf('#maintenanceScreen {');
          const maintenanceEndNeedle = '.maintenance-admin-status-success { color: #6ee7b7; }';
          const maintenanceEndAt = css.indexOf(maintenanceEndNeedle, maintenanceStart);
          must(maintenanceStart >= 0 && maintenanceEndAt > maintenanceStart, 'maintenance fallback styles not found');
          const maintenanceCss = css.slice(maintenanceStart, maintenanceEndAt + maintenanceEndNeedle.length);

          const critical = [
            '    <style id="critical-shell-safety">',
            '        /* Same-document fallback: keeps view gating and maintenance usable even if external CSS fails. */',
            '        .hidden { display: none; }',
            '        html, body { background-color: #0b0e14; }',
            '        body { overflow-x: hidden; }',
            '        @keyframes spin { to { transform: rotate(360deg); } }',
            '        .spinner { width: 40px; height: 40px; border: 3px solid #242d3d; border-top-color: #10b981; border-radius: 50%; animation: spin 0.8s linear infinite; }',
            maintenanceCss.split('\n').map(line => '        ' + line).join('\n'),
            '    </style>',
            ''
          ].join('\n');

          must(!html.includes('id="critical-shell-safety"'), 'critical fallback already inserted unexpectedly');
          const tailwindLink = '    <link rel="stylesheet" href="/tailwind-build.css?v=20260813-tw-v1">\n';
          must(html.includes(tailwindLink), 'Tailwind link anchor missing');
          html = html.replace(tailwindLink, critical + tailwindLink);

          // 2) Do not put the active Day Trade UI/polling runtime in a one-day
          // cacheable feature bundle. Keep it inline in the exact original order;
          // only chart/export/presentation helpers remain externalized.
          const dtStartMarker = '// ============================================================\n// DAY TRADE SCREENER — JavaScript Functions\n// ============================================================';
          const dtStart = runtime.indexOf(dtStartMarker);
          must(dtStart > 0, 'Day Trade runtime marker not found in cached runtime');
          const marketOnly = runtime.slice(0, dtStart).trimEnd() + '\n';
          const dayTradeTail = runtime.slice(dtStart).trimEnd() + '\n';
          must(dayTradeTail.includes('function loadDayTradeScreener()'), 'Day Trade loader missing from tail');
          must(dayTradeTail.includes('function startDtPolling()'), 'Day Trade polling missing from tail');
          must(dayTradeTail.includes('function exportDayTradePDF()'), 'Day Trade PDF export missing from tail');
          must(!marketOnly.includes('function loadDayTradeScreener()'), 'Day Trade loader still in cached market runtime');

          const marketRef = '<script src="/market-feature-runtime.js?v=20260818-v1"></script>\n';
          const accessMarker = '<script>\n// ===== ACCESSIBILITY:';
          const refAt = html.indexOf(marketRef);
          const accessAt = html.indexOf(accessMarker, refAt);
          must(refAt >= 0 && accessAt > refAt, 'market/accessibility ordering anchor missing');
          must(!html.slice(refAt, accessAt).includes(dtStartMarker), 'Day Trade tail already restored unexpectedly');
          html = html.slice(0, refAt + marketRef.length) + '<script>\n' + dayTradeTail + '</script>\n' + html.slice(refAt + marketRef.length);

          fs.writeFileSync(indexPath, html);
          fs.writeFileSync(cssPath, css);
          fs.writeFileSync(runtimePath, marketOnly);

          // Strengthen regression coverage around the two safety boundaries.
          let test = fs.readFileSync(testPath, 'utf8');
          test = test.replace(
            "  const shellAt = html.indexOf('/index-shell.css?v=20260818-v1');\n  const themeAt = html.indexOf('/ui-theme.css');\n  assert.ok(shellAt > 0 && themeAt > shellAt);\n  const head = html.slice(0, html.indexOf('</head>'));\n  assert.doesNotMatch(head, /<style>/i);",
            "  const criticalAt = html.indexOf('id=\"critical-shell-safety\"');\n  const tailwindAt = html.indexOf('/tailwind-build.css');\n  const shellAt = html.indexOf('/index-shell.css?v=20260818-v1');\n  const themeAt = html.indexOf('/ui-theme.css');\n  assert.ok(criticalAt > 0 && tailwindAt > criticalAt && shellAt > tailwindAt && themeAt > shellAt);\n  const head = html.slice(0, html.indexOf('</head>'));\n  assert.equal((head.match(/<style/gi) || []).length, 1);\n  assert.match(head, /\\.hidden \\{ display: none; \\}/);\n  assert.match(head, /\\.maintenance-card \\{/);\n  assert.doesNotMatch(css, /\\.hidden \\{ display: none; \\}/);"
          );
          test = test.replace(
            "  assert.match(runtime, /window\\.loadPdfLibrary\\(\\)\\.then/);\n});",
            "  assert.match(runtime, /window\\.loadPdfLibrary\\(\\)\\.then/);\n  assert.doesNotMatch(runtime, /DAY TRADE SCREENER — JavaScript Functions/);\n  assert.doesNotMatch(runtime, /function loadDayTradeScreener\\(\\)/);\n  const dayTradeAt = html.indexOf('DAY TRADE SCREENER — JavaScript Functions', refAt);\n  const accessibilityAt2 = html.indexOf('// ===== ACCESSIBILITY:', refAt);\n  assert.ok(dayTradeAt > refAt && accessibilityAt2 > dayTradeAt);\n  assert.match(html.slice(dayTradeAt, accessibilityAt2), /function loadDayTradeScreener\\(\\)/);\n  assert.match(html.slice(dayTradeAt, accessibilityAt2), /function startDtPolling\\(\\)/);\n});"
          );
          fs.writeFileSync(testPath, test);
          NODE

      - name: Validate extracted JavaScript syntax
        run: node --check public/market-feature-runtime.js

      - name: Run focused boundary tests
        run: node --test test/frontend-runtime-decomposition.test.js

      - name: Run full production build gate
        run: npm run build

      - name: Re-run focused tests after build transforms
        run: node --test test/frontend-runtime-decomposition.test.js

      - name: Validate diff
        run: git diff --check

      - name: Commit validated source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/index-shell.css public/market-feature-runtime.js test/frontend-runtime-decomposition.test.js
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 1
          fi
          git commit -m "Preserve frontend fallback and Day Trade runtime boundary"
          git push origin HEAD:chore/frontend-runtime-decomposition-v1
