name: Premium V12 Temporary Worker

on:
  push:
    branches:
      - redesign/premium-workstation-v1

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, 'feat: integrate public trust navigation v12') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: redesign/premium-workstation-v1
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@1e60f620b9541d9d15b7a0188f93c91c2695a3f # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply public-shell integration
        run: node tools/apply-premium-v12.js
      - name: Focused public landing test
        run: node --test test/public-landing-diligence.test.js test/public-identity.test.js test/premium-workstation-ui.test.js
      - name: Production build contract
        run: npm run build
      - name: Diff whitespace check
        run: git diff --check
      - name: Commit validated source only
        run: |
          if git diff --quiet -- public/index.html test/public-landing-diligence.test.js; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html test/public-landing-diligence.test.js
          git commit -m 'feat: integrate public trust navigation v12'
          git push origin HEAD:redesign/premium-workstation-v1
