name: One-off startup watchdog hotfix

on:
  push:
    branches:
      - feat/daytrade-screener-v1
    paths:
      - '.github/workflows/oneoff-startup-watchdog-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/daytrade-screener-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prevent watchdog from replacing an active signed-in view
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path('public/index.html')
          html = html_path.read_text(encoding='utf-8')

          old_fallback = """function renderStartupFallback() {
              setTopLevelView('landing');
              var landing = document.getElementById('landingPage');
              var notice = document.getElementById('startupFallbackNotice');
              if (!notice && landing) { notice=document.createElement('p'); notice.id='startupFallbackNotice'; notice.className='mx-auto mt-4 max-w-xl px-4 text-center text-sm text-yellow-300'; notice.setAttribute('role','status'); notice.textContent='Beberapa fitur sementara tidak tersedia.'; landing.prepend(notice); }
          }
          """
          new_fallback = """function renderStartupFallback() {
              // Never replace a view that startup has already selected. The loader stays
              // mounted but hidden, so checking only for its DOM existence caused the
              // watchdog to send signed-in users back to the public landing page.
              var activeView = document.querySelector('#landingPage:not(.hidden), #dashboardScreen:not(.hidden), #blockedScreen:not(.hidden), #maintenanceScreen:not(.hidden)');
              if (activeView) return;
              if (isAutocuanLoggedIn()) {
                  try { handleAppRoute({ duringInit: true }); }
                  catch (_) { setTopLevelView('app'); showDashboard(); }
                  return;
              }
              setTopLevelView('landing');
              var landing = document.getElementById('landingPage');
              var notice = document.getElementById('startupFallbackNotice');
              if (!notice && landing) { notice=document.createElement('p'); notice.id='startupFallbackNotice'; notice.className='mx-auto mt-4 max-w-xl px-4 text-center text-sm text-yellow-300'; notice.setAttribute('role','status'); notice.textContent='Beberapa fitur sementara tidak tersedia.'; landing.prepend(notice); }
          }
          """
          if old_fallback not in html:
              raise SystemExit('startup fallback block not found')
          html = html.replace(old_fallback, new_fallback, 1)

          old_watchdog = "setTimeout(function() { if (document.getElementById('initialLoader')) renderStartupFallback(); }, 4500);"
          new_watchdog = "setTimeout(function() { var loader=document.getElementById('initialLoader'); if (loader && !loader.classList.contains('hidden')) renderStartupFallback(); }, 4500);"
          if old_watchdog not in html:
              raise SystemExit('startup watchdog target not found')
          html = html.replace(old_watchdog, new_watchdog, 1)

          old_copy = 'Bandingkan manfaat, harga, dan masa aktif setiap paket. Pembayaran melalui transfer bank akan tersedia pada tahap berikutnya.'
          new_copy = 'Bandingkan manfaat, harga, dan masa aktif setiap paket secara transparan.'
          if old_copy not in html:
              raise SystemExit('subscription hero copy target not found')
          html = html.replace(old_copy, new_copy, 1)

          old_toast = "showToast('Pembayaran melalui transfer bank akan tersedia pada tahap berikutnya. Tidak ada pembelian atau akses yang diproses dari halaman ini.','info');"
          new_toast = "showToast('Pilihan pembayaran belum dibuka. Tidak ada pembelian atau akses yang diproses dari halaman ini.','info');"
          if old_toast not in html:
              raise SystemExit('subscription toast copy target not found')
          html = html.replace(old_toast, new_toast, 1)

          html_path.write_text(html, encoding='utf-8')

          test_path = Path('test/production-loader-hotfix.test.js')
          test = test_path.read_text(encoding='utf-8')
          old_assert = "  assert.match(html, /setTimeout\\(function\\(\\) \\{ if \\(document\\.getElementById\\('initialLoader'\\)\\) renderStartupFallback\\(\\); \\}, 4500\\)/);"
          new_assert = "  assert.match(html, /setTimeout\\(function\\(\\) \\{ var loader=document\\.getElementById\\('initialLoader'\\); if \\(loader && !loader\\.classList\\.contains\\('hidden'\\)\\) renderStartupFallback\\(\\); \\}, 4500\\)/);\n  assert.match(html, /var activeView = document\\.querySelector\\('#landingPage:not\\(\\.hidden\\), #dashboardScreen:not\\(\\.hidden\\), #blockedScreen:not\\(\\.hidden\\), #maintenanceScreen:not\\(\\.hidden\\)'\\);/);\n  assert.match(html, /if \\(activeView\\) return;/);\n  assert.match(html, /if \\(isAutocuanLoggedIn\\(\\)\\) \\{[\\s\\S]{0,220}handleAppRoute/);"
          if old_assert not in test:
              raise SystemExit('loader test assertion target not found')
          test = test.replace(old_assert, new_assert, 1)
          test += """

test('startup watchdog cannot replace an already active signed-in view', () => {
  assert.doesNotMatch(html, /setTimeout\(function\(\) \{ if \(document\.getElementById\('initialLoader'\)\) renderStartupFallback\(\); \}, 4500\)/);
  assert.match(html, /loader && !loader\.classList\.contains\('hidden'\)/);
  assert.match(html, /if \(activeView\) return;/);
});

test('subscription page does not advertise unfinished phase wording', () => {
  assert.match(html, /Bandingkan manfaat, harga, dan masa aktif setiap paket secara transparan\./);
  assert.doesNotMatch(html, /tersedia pada tahap berikutnya/);
});
"""
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: Validate hotfix
        run: |
          npm ci --ignore-scripts
          npm run build
          git diff --check
          node --test test/production-loader-hotfix.test.js
          node --test test/device-block-regression.test.js test/subscription-phase6a-ui.test.js test/subscription-phase6a-access.test.js
      - name: Commit hotfix and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/oneoff-startup-watchdog-hotfix.yml
          git add public/index.html test/production-loader-hotfix.test.js
          git commit -m 'fix: keep active session view during startup watchdog'
          git push origin HEAD:feat/daytrade-screener-v1
