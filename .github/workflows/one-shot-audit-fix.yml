name: One-shot audit reliability patch

on:
  push:
    branches:
      - claude/repo-audit-skills-5c832e
    paths:
      - .github/workflows/one-shot-audit-fix.yml
  pull_request:
    branches:
      - feat/daytrade-screener-v1
    paths:
      - .github/workflows/one-shot-audit-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: claude/repo-audit-skills-5c832e
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Apply deterministic reliability patch
        run: python3 tools/one-shot-audit-fix.py

      - name: Run focused regression tests
        run: >-
          node --test
          test/ai-narration-idx-price-band.test.js
          test/telegram-monitor-delivery-order.test.js
          test/telegram-notifier-rate-limit.test.js
          test/trade-plan-v2-declared-guards.test.js
          test/ai-context-snapshot-ticker-scope.test.js
          test/public-screener-share-ranking.test.js

      - name: Run production build gate
        run: npm run build

      - name: Verify diff scope
        shell: bash
        run: |
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(api/sector-hot\.js|lib/telegram-notifier\.js|test/telegram-monitor-delivery-order\.test\.js|test/telegram-notifier-rate-limit\.test\.js)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed by patch/build:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit verified patch and remove temporary worker
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-audit-fix.yml tools/one-shot-audit-fix.py
          git add api/sector-hot.js lib/telegram-notifier.js test/telegram-monitor-delivery-order.test.js test/telegram-notifier-rate-limit.test.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: make monitor alerts retryable and webhook fail closed"
          git push origin HEAD:claude/repo-audit-skills-5c832e
