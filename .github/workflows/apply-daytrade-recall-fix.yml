name: Apply Day Trade Recall Fix

on:
  pull_request:
    branches:
      - feat/daytrade-screener-v1
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.head_ref == 'fix/daytrade-finalizer-watcher-recall-20260801'
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/daytrade-finalizer-watcher-recall-20260801
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repair staged generator syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/apply-daytrade-recall-fix-once.js')
          source = path.read_text()
          replacements = [
              (
                  "  if (source.indexOf(search, index + search.length) >= 0) {\n    throw new Error(`Patch target is ambiguous: ${label}`);\n  }\n",
                  ""
              ),
              (
                  "    now: `2026-07-31T${String(Number(time.slice(0, 2)) - 7).padStart(2, '0')}:${time.slice(3)}:00.000Z`",
                  "    now: null"
              ),
              (
                  "    priorState.tickers[`OLD${index}`] = {",
                  "    priorState.tickers['OL' + String.fromCharCode(65 + index)] = {"
              ),
              (
                  "    ticker: `NEW${index}`, status: 'EARLY_RADAR', daytrade_score: 80 - index",
                  "    ticker: 'NE' + String.fromCharCode(65 + index), status: 'EARLY_RADAR', daytrade_score: 80 - index"
              ),
          ]

          for old, new in replacements:
              if old not in source:
                  raise SystemExit('staged generator repair target not found: ' + old[:80])
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY
          node --check tools/apply-daytrade-recall-fix-once.js

      - name: Apply source patch
        run: node tools/apply-daytrade-recall-fix-once.js

      - name: Syntax checks
        run: |
          node --check api/sector-hot.js
          node --check lib/daytrade-screener-engine.js
          node --check lib/intraday-fast-watcher-pool.js
          node --check lib/intraday-fast-watcher-live.js
          node --check lib/intraday-fast-watcher-guarded-live.js

      - name: Focused regression tests
        run: |
          node --test \
            test/daytrade-finalizer-schema-contract.test.js \
            test/daytrade-run-mode-window.test.js \
            test/intraday-fast-watcher-recall.test.js \
            test/intraday-fast-watcher-lifecycle-reset.test.js

      - name: Commit patched source and tests
        run: |
          git config user.name "auto-cuan-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add api/sector-hot.js \
            lib/daytrade-screener-engine.js \
            lib/intraday-fast-watcher-pool.js \
            lib/intraday-fast-watcher-live.js \
            lib/intraday-fast-watcher-guarded-live.js \
            test/daytrade-finalizer-schema-contract.test.js \
            test/daytrade-run-mode-window.test.js \
            test/intraday-fast-watcher-recall.test.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "fix: recover Day Trade candidates and watcher recall [skip ci]"
            git push origin HEAD:fix/daytrade-finalizer-watcher-recall-20260801
          fi
