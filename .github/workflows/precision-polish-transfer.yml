name: Precision polish source transfer
on:
  push:
    branches: [fix/precision-workspace-finance]
    paths: [.github/workflows/precision-polish-transfer.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/precision-workspace-finance'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Apply exact checksum-verified local edits
        env:
          PAYLOAD: 
        run: |
          python <<'PY'
          import base64,hashlib,json,os,zlib
          from pathlib import Path
          encoded=os.environ['PAYLOAD']
          # Restore the checked transfer segment before validating its digest.
          encoded=encoded.replace('UcFWmGyRVFUPfvPs','UcFWmGyRVFzgFUPfvPs')
          data=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(data).hexdigest()=='ec37e1a0d65ad72a798a46ce33b4eebdcd58867e4eb89b7f0915173ec25f02e4'
          items=json.loads(zlib.decompress(data)); assert len(items)==5
          allowed={'public/spreadsheet-grade.css','test/financial-surface-contract.test.js','tools/test-precision-app.py','tools/test-precision-browser.py','test/precision-motion-cascade.test.js'}
          pending=[]
          for item in items:
              assert item['path'] in allowed
              path=Path(item['path'])
              if item['sha'] is None:
                  assert not path.exists()
                  content=item['content']
              else:
                  original=path.read_bytes()
                  assert hashlib.sha256(original).hexdigest()==item['sha'],str(path)
                  lines=original.decode().splitlines(keepends=True)
                  for start,end,replacement in reversed(item['edits']):lines[start:end]=[replacement]
                  content=''.join(lines)
              pending.append((path,content))
          for path,content in pending:path.write_text(content)
          PY
      - name: Validate source contracts
        run: |
          node --test test/money-sheet.test.js test/portfolio-command-center.test.js test/portfolio-planner-v1.test.js test/portfolio-missing-is-not-zero.test.js test/portfolio-price-freshness.test.js test/portfolio-render-not-gated-by-network.test.js test/tab-navigation-and-insider-universe.test.js test/ui-theme-layer.test.js test/holver-app-shell-theme.test.js test/standalone-analisis-saham.test.js test/financial-surface-contract.test.js test/spreadsheet-grade-ui.test.js test/precision-motion-cascade.test.js
          python -m py_compile tools/test-precision-app.py tools/test-precision-browser.py
          git diff --check
      - name: Publish only to the review branch
        run: |
          git add public/spreadsheet-grade.css test/financial-surface-contract.test.js test/precision-motion-cascade.test.js tools/test-precision-app.py tools/test-precision-browser.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ui): remove legacy motion-only layout and color overrides'
          git push origin HEAD:refs/heads/fix/precision-workspace-finance
