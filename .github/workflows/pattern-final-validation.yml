name: Pattern Final Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Syntax checks
        run: |
          node --check lib/classic-chart-patterns.js
          node --check lib/smart-setup-labels.js
          node --check lib/weekly-timeframe.js
          node --check lib/atr-report-helpers.js
          node --check public/pattern-screener-extension.js
      - name: Focused regression tests
        run: |
          node --test \
            test/classic-chart-patterns.test.js \
            test/pattern-ranking-integration.test.js \
            test/weekly-timeframe.test.js \
            test/atr-report-helpers.test.js \
            test/pattern-radar.test.js \
            test/pattern-screener-extension.test.js
      - name: Production build gate
        run: npm run build
      - name: API count
        run: test "$(find api -maxdepth 1 -type f -name '*.js' | wc -l | tr -d ' ')" = "12"
