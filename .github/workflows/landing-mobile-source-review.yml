name: Apply reviewed landing and mobile source
on:
  push:
    branches: [fix/precision-workspace-finance]
    paths: [.github/workflows/landing-mobile-source-review.yml]
permissions:
  contents: read
jobs:
  apply-reviewed-source:
    if: github.ref == 'refs/heads/fix/precision-workspace-finance'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Verify exact baseline and source checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD^)" = 78c8efbaff1569da818d025b580aa5f2b79f63ca
          python <<'PY'
          import base64, hashlib, json, os, urllib.request, zlib
          from pathlib import Path
          url = 'https://api.github.com/repos/budikuatno2-ship-it/auto-cuan/git/blobs/54a55923c0b1672b4852cfc696f418a6fc41ad1c'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              blob = json.load(response)
          data = base64.b64decode(blob['content'])
          assert hashlib.sha256(data).hexdigest() == 'cc8c7ceaeec1d3f966eb0e470e09c6c310ef49f5ad6f47601d52c551e72d40e2'
          items = json.loads(zlib.decompress(data))
          allowed = {'docs/PEDOMAN-MOTION.md', 'public/auth-v2.js', 'public/index.html', 'public/ui-theme.css', 'public/website-approved-access.js', 'tools/build-smoke-tests.json', 'tools/curated-build-tests.json', 'public/landing-experience.js', 'public/landing-experience.css', 'test/landing-experience.test.js', 'tools/test-landing-experience.py', 'docs/LANDING-MOBILE-REVIEW.md'}
          assert len(items) == 13
          pending = []
          for item in items:
              if item['path'] == '.github/workflows/precision-workspace-tests.yml':
                  continue
              assert item['path'] in allowed
              path = Path(item['path'])
              if item['sha'] is None:
                  assert not path.exists(), str(path)
                  content = item['content']
              else:
                  old = path.read_text()
                  assert hashlib.sha256(old.encode()).hexdigest() == item['sha'], str(path)
                  lines = old.splitlines(True)
                  for start, end, text in reversed(item['edits']):
                      lines[start:end] = text.splitlines(True)
                  content = ''.join(lines)
              assert hashlib.sha256(content.encode()).hexdigest() == item['after'], str(path)
              pending.append((path, content, item['after']))
          assert {str(path) for path, _, _ in pending} == allowed
          for path, content, _ in pending:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content)
          Path('/tmp/landing-reviewed-manifest.json').write_text(json.dumps({str(path): digest for path, _, digest in pending}))
          print('Verified and applied 12 reviewed source files; CI workflow updated separately.')
          PY
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tools/validate-full-syntax.js && node tools/check-precision-inline.js && node tools/build-portfolio-spa-css.js --check
      - run: node --test test/money-sheet.test.js test/portfolio-command-center.test.js test/portfolio-planner-v1.test.js test/portfolio-missing-is-not-zero.test.js test/portfolio-price-freshness.test.js test/portfolio-render-not-gated-by-network.test.js test/tab-navigation-and-insider-universe.test.js test/ui-theme-layer.test.js test/holver-app-shell-theme.test.js test/standalone-analisis-saham.test.js test/financial-surface-contract.test.js test/spreadsheet-grade-ui.test.js test/precision-motion-cascade.test.js test/landing-experience.test.js
      - run: npm run build
      - name: Commit only validated source to review branch
        run: |
          python <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          files = json.loads(Path('/tmp/landing-reviewed-manifest.json').read_text())
          for name, digest in files.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *files], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ui): refine landing, mobile dialogs and accessible motion'
          git push origin HEAD:refs/heads/fix/precision-workspace-finance
