name: Precision workspace review
on:
  push:
    branches: [fix/precision-workspace-finance]
    paths: [.github/workflows/precision-workspace-review.yml]
permissions:
  contents: read
jobs:
  publish-reviewed-source:
    if: github.ref == 'refs/heads/fix/precision-workspace-finance'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify source transfer checksums
        run: |
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),zlib=require('node:zlib');
          const base64=[0,1,2,3].map(i=>fs.readFileSync('tools/precision-payload-'+i+'.txt','utf8').trim()).join('');
          const data=Buffer.from(base64,'base64');
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          if(hash(data)!=='b3d01955f42c696c1b0d397151156734affd7be325a9b9c95f06b8134eb9af08')throw Error('Compressed source checksum mismatch');
          const source=zlib.brotliDecompressSync(data,{maxOutputLength:1048576});
          if(hash(source)!=='f1a7aa88ea179c6a45f099106649f6c3b7457028cb7790b0a996cd7b867f4c8d')throw Error('Source JSON checksum mismatch');
          fs.writeFileSync('/tmp/precision-source.json',source);
          NODE
      - name: Apply validated source edits without overwriting concurrent changes
        run: |
          python <<'PY'
          import hashlib,json
          from pathlib import Path
          payload=json.loads(Path('/tmp/precision-source.json').read_text())
          assert payload['version']==1 and len(payload['files'])==24
          outputs=[]
          for item in payload['files']:
              path=Path(item['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in ('public','partials','lib','supabase','test','tools','docs','.github')
              if item['sha256'] is None:
                  text=item['content']
                  if path.exists():
                      assert path.as_posix()=='.github/workflows/precision-workspace-tests.yml'
                      assert path.read_bytes()==text.encode('utf8'), str(path)
                      continue
              else:
                  data=path.read_bytes()
                  assert hashlib.sha256(data).hexdigest()==item['sha256'], str(path)
                  lines=data.decode('utf8').splitlines(keepends=True)
                  previous=len(lines)+1
                  for start,end,replacement in reversed(item['edits']):
                      assert 0<=start<=end<=len(lines) and end<=previous
                      lines[start:end]=[replacement]
                      previous=start
                  text=''.join(lines)
              outputs.append((path,text))
          for path,text in outputs:
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(text,encoding='utf8')
              print('Applied',path)
          # Hidden chart controls still need to be mounted, not visible, when testing other analysis views.
          path=Path('tools/test-precision-app.py')
          text=path.read_text()
          old="page.wait_for_selector('#analisisPartialMount #analisisInput')"
          assert text.count(old)==1
          path.write_text(text.replace(old,"page.wait_for_selector('#analisisPartialMount #analisisInput',state='attached')"))
          PY
      - name: Generate scoped CSS and run source validation
        run: |
          node tools/build-portfolio-spa-css.js
          node tools/build-portfolio-spa-css.js --check
          node tools/check-precision-inline.js
          node tools/validate-full-syntax.js
          node --test test/money-sheet.test.js test/portfolio-command-center.test.js test/portfolio-planner-v1.test.js test/portfolio-missing-is-not-zero.test.js test/portfolio-price-freshness.test.js test/portfolio-render-not-gated-by-network.test.js test/tab-navigation-and-insider-universe.test.js test/ui-theme-layer.test.js test/holver-app-shell-theme.test.js test/standalone-analisis-saham.test.js > /tmp/precision-regression.txt
          tail -n 10 /tmp/precision-regression.txt
      - name: Commit only reviewed changes to the isolated fix branch
        run: |
          git rm tools/precision-payload-0.txt tools/precision-payload-1.txt tools/precision-payload-2.txt tools/precision-payload-3.txt
          git add public partials lib/money-management-handler.js lib/money-sheet-handler.js supabase/money-sheet-v1-migration.sql test/money-sheet.test.js test/sql/money-sheet tools/build-portfolio-spa-css.js tools/check-precision-inline.js tools/curated-build-tests.json tools/build-smoke-tests.json tools/precision-test-requirements.txt tools/test-precision-app.py tools/test-precision-browser.py docs/PRECISION-WORKSPACE-REVIEW.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ui): stabilize workspace navigation and linked finance worksheet'
          git push origin HEAD:refs/heads/fix/precision-workspace-finance
          git archive --format=zip --output=/tmp/precision-reviewed-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: precision-reviewed-source
          path: |
            /tmp/precision-reviewed-source.zip
            /tmp/precision-regression.txt
          retention-days: 2
