name: Precision workspace review

on:
  push:
    branches: [fix/precision-workspace-finance]
    paths:
      - .github/workflows/precision-workspace-review.yml
      - tools/precision-workspace-apply.js

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source for isolated UI review
        run: git archive --format=zip --output=/tmp/precision-workspace-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: precision-workspace-source
          path: /tmp/precision-workspace-source.zip
          retention-days: 2
