name: Monitor Locked Top 5 Picks (Manual Only)

# Scheduled runs were disabled on 2026-08-01 to stop recurring calls to the
# Vercel telegram-monitor-picks endpoint. Keep workflow_dispatch available for
# explicit troubleshooting while the VPS-local monitor replacement is audited.
on:
  workflow_dispatch:

permissions: {}

jobs:
  monitor-picks:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Validate secrets
        env:
          AUTO_CUAN_BASE_URL: ${{ secrets.AUTO_CUAN_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${AUTO_CUAN_BASE_URL}" ]; then
            echo "::error::AUTO_CUAN_BASE_URL secret is not set"
            exit 1
          fi
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET secret is not set"
            exit 1
          fi
          echo "Secrets validated successfully."

      - name: Call telegram monitor endpoint
        env:
          AUTO_CUAN_BASE_URL: ${{ secrets.AUTO_CUAN_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          BASE_URL="${AUTO_CUAN_BASE_URL%/}"
          ENDPOINT="${BASE_URL}/api/sector-hot?action=telegram-monitor-picks"

          echo "Current UTC time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Target endpoint: ${ENDPOINT}"

          RESPONSE_BODY=$(curl -fsS \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 150 \
            "${ENDPOINT}")

          echo "Response body:"
          printf '%s\n' "${RESPONSE_BODY}"
