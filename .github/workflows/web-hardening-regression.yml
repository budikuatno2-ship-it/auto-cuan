name: Web hardening regression

on:
  pull_request:
    branches:
      - feat/daytrade-screener-v1
      - main
    paths:
      - 'public/**'
      - 'api/**'
      - 'lib/**'
      - 'test/**'
      - 'tools/**'
      - 'deploy/vps/**'
      - '.agents/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-hardening-regression.yml'
      # Documentation-only PRs must still run this required check, otherwise the
      # ruleset blocks the merge because the check never reports (Batch 0 fix).
      - '**/*.md'

permissions:
  contents: read

jobs:
  build-and-focused-tests:
    runs-on: ubuntu-latest
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    # Release gate checks bounded smoke plus explicit V5 safety contracts.
    # The legacy full suite runs in a separately visible diagnostic job below.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Account Center contract
        run: node --test test/account-center-contract.test.js

      - name: Subscription enforcement contract
        run: node --test test/subscription-enforcement-v1.test.js

      - name: Telegram command audit
        run: node --test test/telegram-command-audit-v1.test.js

      - name: Existing hardening regressions
        run: node --test test/runtime-hardening-regressions.test.js test/ai-deterministic-ui-fixtures.test.js test/ai-provider-failover.test.js test/ai-ui-failure-states.test.js test/ai-context-fixtures-stress.test.js test/pattern-direction-safety.test.js test/reversal-breakout-lifecycle.test.js test/screener-lifecycle-ui.test.js test/web-security-boundaries.test.js test/ui-bugfix-pack-v1.test.js test/telegram-unified-subscription.test.js

      - name: Portfolio AI resilience regressions
        run: node --test test/context-ai-secondary-provider.test.js test/portfolio-ai-workspace-resilience.test.js

      - name: Production build contract
        run: npm run build

      - name: Smoke suite (required)
        run: npm run test:smoke

      # Only source/fixture-independent controls run as a required gate on a
      # fresh checkout. Market snapshots, videos and audit manifests are stored
      # outside Git and cannot be treated as present in GitHub Actions.
      - name: V5 portable anti-fake controls (required)
        run: node test/v5/run.js --no-write --only N1,N2,N3,N8,N9,N12,N13,N14,N15,N16,N17,N18,N19,N20,N21,N22

      - name: V5 external-evidence controls (diagnostic, not a release PASS)
        run: |
          node test/v5/run.js --no-write --diagnostic --only N4,N5,N6,N7,N10,N11,N23,N24,N25
          echo "External-evidence controls require production snapshots/manifests; SKIP is not PASS." >> "$GITHUB_STEP_SUMMARY"

      - name: V5 safety and runtime contracts (required)
        run: |
          set -eu
          for file in \
            test/v5/quota-f1-p0.test.js \
            test/v5/quota-f1-fix-read-fail-closed.test.js \
            test/v5/quota-s2-admin-concurrency.test.js \
            test/v5/quota-p1-04.test.js \
            test/v5/readiness-engine.test.js \
            test/v5/strategy-registry-qualification.test.js \
            test/v5/strategy-registry-pf-rr-thresholds.test.js \
            test/v5/foreign-compile-missing.test.js \
            test/v5/deferred-integration-s3.test.js \
            test/v5/f3-legacy-foreign-adapter.test.js \
            test/v5/chart-state-guard.test.js \
            test/v5/admin-console-http.test.js \
            test/v5/security-hardening.test.js \
            test/v5/run-exit-code.test.js
          do
            echo "::group::$file"
            node --test "$file"
            echo "::endgroup::"
          done

      - name: Diff whitespace check
        run: git diff --check HEAD^ HEAD

  full-regression-diagnostic:
    name: full-regression-diagnostic (non-blocking legacy suite)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run full 778-file regression (diagnostic; failures are reported)
        id: full
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:full 2>&1 | tee full-regression.log
      - name: Publish result transparently
        if: always()
        run: |
          echo "### Full regression diagnostic" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: \`\${{ steps.full.outcome }}\` (NOT a required release gate while the legacy suite is reconciled)." >> "$GITHUB_STEP_SUMMARY"
          echo "The full test command remains enabled. Investigate newly introduced failures before deployment." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload full regression log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-regression-diagnostic
          path: full-regression.log
          retention-days: 7
