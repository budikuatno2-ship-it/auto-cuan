name: Web hardening regression

on:
  pull_request:
    branches:
      - feat/daytrade-screener-v1
    paths:
      - 'public/**'
      - 'api/**'
      - 'lib/**'
      - 'test/**'
      - 'tools/**'
      - '.agents/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-hardening-regression.yml'

permissions:
  contents: read

jobs:
  patch-swing-nk-v2:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/swing-nk-trade-plan-v2-persistence
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Apply deterministic patch
        run: |
          python3 tools/apply-swing-nk-v2-persistence-temp.py
          sed -i "1c'use strict';" test/swing-nk-trade-plan-v2-persistence.test.js

      - name: Install dependencies
        run: npm ci

      - name: Focused persistence regression
        run: node --test test/swing-nk-trade-plan-v2-persistence.test.js

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/sector-hot.js supabase/swing-screener-non-konglo.sql supabase/patch-swing-nk-trade-plan-v2-persistence.sql test/swing-nk-trade-plan-v2-persistence.test.js
          if git diff --cached --quiet; then
            echo "No source patch changes to commit"
            exit 0
          fi
          git commit -m "fix: preserve Swing NK Trade Plan V2 through persistence"
          git push origin HEAD:fix/swing-nk-trade-plan-v2-persistence

  build-and-focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Account Center contract
        run: node --test test/account-center-contract.test.js

      - name: Subscription enforcement contract
        run: node --test test/subscription-enforcement-v1.test.js

      - name: Telegram command audit
        run: node --test test/telegram-command-audit-v1.test.js

      - name: Existing hardening regressions
        run: node --test test/runtime-hardening-regressions.test.js test/ai-deterministic-ui-fixtures.test.js test/ai-provider-failover.test.js test/ai-ui-failure-states.test.js test/ai-context-fixtures-stress.test.js test/telegram-unified-subscription.test.js test/pattern-direction-safety.test.js test/reversal-breakout-lifecycle.test.js test/screener-lifecycle-ui.test.js test/web-security-boundaries.test.js test/ui-bugfix-pack-v1.test.js

      - name: Portfolio AI resilience regressions
        run: node --test test/context-ai-secondary-provider.test.js test/portfolio-ai-workspace-resilience.test.js

      - name: Production build contract
        run: npm run build

      - name: Diff whitespace check
        run: git diff --check HEAD^ HEAD
