name: Web hardening regression

on:
  pull_request:
    branches:
      - feat/daytrade-screener-v1
    paths:
      - 'public/**'
      - 'api/**'
      - 'lib/**'
      - 'test/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-hardening-regression.yml'

permissions:
  contents: read

jobs:
  build-and-focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused hardening regressions
        run: node --test test/runtime-hardening-regressions.test.js test/pattern-direction-safety.test.js test/web-security-boundaries.test.js test/ui-bugfix-pack-v1.test.js

      - name: Production build contract
        run: npm run build

      - name: Diff whitespace check
        run: git diff --check HEAD^ HEAD
