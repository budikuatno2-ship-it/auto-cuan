<!doctype html>
<html lang="id" style="background:#0b0e14">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0e14">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <title>Auto-Cuan</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0e14;color:#94a3b8;font:14px system-ui}
    .loader{width:34px;height:34px;border:3px solid #263043;border-top-color:#34d399;border-radius:50%;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
    .error{max-width:560px;padding:28px;text-align:center}.error h1{color:#e5e7eb}.error a{color:#34d399}
  </style>
</head>
<body>
  <div class="loader" aria-label="Memuat dashboard"></div>
  <script>
  (async function(){
    'use strict';

    function isSubscriptionText(value) {
      return /paket langganan|langganan|subscription/i.test(String(value || '').trim());
    }

    function removeSubscription(doc) {
      doc.querySelectorAll('[data-page="subscription"],#page-subscription,#subscriptionIdentityCard').forEach(function (el) {
        el.remove();
      });
      doc.querySelectorAll('a,button').forEach(function (el) {
        if (isSubscriptionText(el.textContent)) el.remove();
      });
    }

    function revealWebsiteFeatures(doc) {
      doc.querySelectorAll('[data-premium-nav="true"]').forEach(function (el) {
        el.classList.remove('hidden','opacity-40','opacity-50','opacity-60','cursor-not-allowed','pointer-events-none','grayscale');
        el.removeAttribute('hidden');
        el.removeAttribute('disabled');
        el.setAttribute('aria-hidden', 'false');
        el.setAttribute('aria-disabled', 'false');
        el.style.removeProperty('display');
        el.style.removeProperty('opacity');
        el.style.removeProperty('pointer-events');
        el.style.removeProperty('cursor');
        el.style.removeProperty('filter');
      });
    }

    function wirePortfolio(doc) {
      doc.querySelectorAll('[data-page="portofolio"]').forEach(function (el) {
        el.setAttribute('onclick', "window.location.href='/portfolio-planner';return false");
      });
      doc.querySelectorAll('.action-card[data-page="portofolio"] p').forEach(function (el) {
        if (String(el.textContent || '').trim() === 'Posisi manual') el.textContent = 'Decision Center';
      });
    }

    function approvedBootstrap(access) {
      return '(function(){\n' +
        "'use strict';\n" +
        'var approved=' + JSON.stringify({ userId:String(access.user_id), username:String(access.username || '') }) + ';\n' +
        'window.__AUTOCUAN_APPROVED_WEBSITE_ACCESS__=approved;\n' +
        'var nativeFetch=window.fetch.bind(window);\n' +
        'window.fetch=function(input,init){\n' +
        "  var raw=typeof input==='string'?input:(input&&input.url)||'';\n" +
        '  try {\n' +
        '    var url=new URL(raw,window.location.origin);\n' +
        "    if(url.pathname==='/api/login-user'&&url.searchParams.get('action')==='premium-access-status'){\n" +
        "      var body=JSON.stringify({success:true,premium:true,access_level:'approved_website',entitlement_status:'approved',current_plan:null,expires_at:null});\n" +
        "      return Promise.resolve(new Response(body,{status:200,headers:{'Content-Type':'application/json','Cache-Control':'private, no-store'}}));\n" +
        '    }\n' +
        '  } catch (_) {}\n' +
        '  return nativeFetch(input,init);\n' +
        '};\n' +
        '})();';
    }

    try {
      var accessResponse = await fetch('/api/admin-users', {
        method:'POST',
        credentials:'same-origin',
        cache:'no-store',
        headers:{'Content-Type':'application/json','Cache-Control':'no-cache'},
        body:JSON.stringify({action:'portfolio_access'})
      });
      var access = await accessResponse.json();
      if (!accessResponse.ok || !access || access.success !== true || !access.user_id) {
        throw new Error((access && access.error) || 'Akun belum di-approve admin.');
      }

      localStorage.setItem('autocuan_user_id', String(access.user_id));
      if (access.username) localStorage.setItem('autocuan_user', String(access.username));

      var response = await fetch('/index.html?approved-shell=20260726g', {
        credentials:'same-origin',
        cache:'no-store',
        headers:{'Cache-Control':'no-cache'}
      });
      if (!response.ok) throw new Error('Dashboard tidak tersedia.');

      var source = await response.text();
      source = source.replace(
        "if (isPremiumFeaturePage(page) && !hasConfirmedPremiumAccess()) {",
        "if (false) {"
      );
      source = source.replace(
        "if (!allowed && isPremiumFeaturePage(currentPage)) {",
        "if (false) {"
      );

      var parser = new DOMParser();
      var doc = parser.parseFromString(source, 'text/html');
      revealWebsiteFeatures(doc);
      removeSubscription(doc);
      wirePortfolio(doc);

      var bootstrap = doc.createElement('script');
      bootstrap.textContent = approvedBootstrap(access);
      doc.head.insertBefore(bootstrap, doc.head.firstChild);

      var responsive = doc.createElement('link');
      responsive.rel = 'stylesheet';
      responsive.href = '/dashboard-responsive-fixes.css?v=20260726g';
      doc.head.appendChild(responsive);

      var forceStyle = doc.createElement('style');
      forceStyle.textContent = 'nav [data-premium-nav="true"]{display:flex!important;opacity:1!important;pointer-events:auto!important;cursor:pointer!important;filter:none!important}.action-card[data-premium-nav="true"]{display:block!important;opacity:1!important;pointer-events:auto!important;cursor:pointer!important;filter:none!important}[data-page="subscription"],#page-subscription,#subscriptionIdentityCard{display:none!important}';
      doc.head.appendChild(forceStyle);

      [
        '/dashboard-approved-access-guard.js?v=20260726g',
        '/dashboard-approved-enhancements.js?v=20260726g',
        '/admin-delete-user.js?v=20260726g',
        '/ai-chat-renderer.js?v=20260726g',
        '/stock-analysis-ai.js?v=20260726g'
      ].forEach(function (src) {
        var script = doc.createElement('script');
        script.src = src;
        doc.body.appendChild(script);
      });

      var restoreUrl = doc.createElement('script');
      restoreUrl.textContent = "try{history.replaceState(null,'','/dashboard')}catch(e){}";
      doc.body.appendChild(restoreUrl);

      document.open();
      document.write('<!doctype html>' + doc.documentElement.outerHTML);
      document.close();
    } catch (error) {
      document.body.innerHTML = '<main class="error"><h1>Dashboard belum terbuka</h1><p>' + String(error && error.message || 'Silakan login kembali.') + '</p><a href="/">Login ulang</a></main>';
    }
  })();
  </script>
</body>
</html>
