# Auto-Cuan cron runner log rotation.
#
# The cron wrappers in deploy/vps/*.sh append to
# /home/ubuntu/auto-cuan-runner/logs/*.log via `>>` with no rotation, so the
# files grow unbounded and can fill the 45 GB root partition. This config caps
# each log at 14 daily generations with compression.
#
# Install on the VPS (one line):
#   sudo cp /home/ubuntu/auto-cuan/deploy/vps/logrotate-autocuan.conf /etc/logrotate.d/autocuan
#
# Verify the config parses without rotating anything:
#   sudo logrotate --debug /etc/logrotate.d/autocuan
#
# Force a rotation now (optional, for testing):
#   sudo logrotate --force /etc/logrotate.d/autocuan

/home/ubuntu/auto-cuan-runner/logs/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su ubuntu ubuntu
}
